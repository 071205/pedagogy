<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PEDAGOGY — 문제집/문항 에디터</title>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- KoPub 바탕체 (한국출판인회의 — 수능 신명조 계열 최적 대체) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopub@1.0/kopubbatang.min.css">
<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<style>
@font-face{
  font-family:'Adobe Caslon Pro Bold';
  src:url('./Adobe Caslon Pro Bold.ttf') format('truetype');
  font-weight:700; font-style:normal; font-display:swap;
}
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

/* ===== Toss Design System ===== */
:root{
  /* Surface */
  --bg:#09090B;
  --surface-1:#111116;
  --surface-2:#18181F;
  --surface-3:#1F1F28;
  --surface-hover:#23232D;

  /* Border */
  --border:#27272F;
  --border-subtle:#1F1F28;

  /* Text */
  --text-primary:#F4F4F6;
  --text-secondary:#8B8B9A;
  --text-tertiary:#55555F;

  /* Toss Blue */
  --blue:#3182F6;
  --blue-dim:#1A3566;
  --blue-subtle:#1B2540;
  --blue-hover:#4D96FF;

  /* Semantic */
  --danger:#F04452;
  --success:#05C072;

  /* UI font */
  --ui-sans: 'Pretendard Variable', Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --body-serif: 'KoPub Batang', "Times New Roman", serif;
  --num-serif: "Noto Serif KR", "Times New Roman", serif;

  /* Print */
  --col-gap-mm:7;
  --print-fs-pt:9.2;
  --print-lh:1.92;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text-primary);font-family:var(--ui-sans);font-size:14px;line-height:1.5}

/* ── Topbar ── */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 24px;height:60px;
  background:rgba(9,9,11,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.brand{
  font-family:'Adobe Caslon Pro Bold',serif!important;
  font-size:22px;letter-spacing:.5px;font-weight:700;
  color:#F4F4F6;cursor:pointer;user-select:none;
}
.actions{display:flex;gap:8px;align-items:center}
.actions input[type="text"]{
  height:36px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-primary);border-radius:var(--radius-md);
  padding:0 12px;font-size:13px;font-family:var(--ui-sans);
  transition:.15s;outline:none;width:200px;
}
.actions input[type="text"]:focus{border-color:var(--blue);background:var(--surface-3)}
.actions input[type="text"]::placeholder{color:var(--text-tertiary)}

/* ── Buttons ── */
button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface-2);color:var(--text-primary);
  border:1px solid var(--border);padding:0 14px;height:36px;
  border-radius:var(--radius-md);font-size:13px;font-weight:500;
  font-family:var(--ui-sans);cursor:pointer;transition:.15s;white-space:nowrap;
}
button:hover{background:var(--surface-hover);border-color:#35353F}
button:active{transform:scale(.98)}
.btn{background:var(--surface-2);border-color:var(--border)}
.btn-primary{background:var(--blue);border-color:transparent;color:#fff}
.btn-primary:hover{background:var(--blue-hover);border-color:transparent}
.btn-accent{background:var(--blue);border-color:transparent;color:#fff;font-weight:600}
.btn-accent:hover{background:var(--blue-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text-primary)}
label.btn{height:36px;padding:0 14px;display:inline-flex;align-items:center;cursor:pointer}
label.btn input{display:none}

/* ── Views ── */
#libraryView,#editorView{display:none}
#editorView{height:calc(100vh - 60px)}
.editor{display:flex;height:100%;overflow:hidden}

/* ── Library ── */
#libraryView{padding:32px;min-height:calc(100vh - 60px)}
.lib-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.lib-header h2{margin:0;font-size:24px;font-weight:700;color:var(--text-primary)}
.lib-actions{display:flex;gap:8px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.set-card{
  position:relative;background:var(--surface-1);
  border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:24px;cursor:pointer;
  transition:border-color .15s, box-shadow .15s, transform .12s;
}
.set-card:hover{border-color:#3F3F4F;box-shadow:0 4px 24px rgba(0,0,0,.4);transform:translateY(-2px)}
.set-card h3{margin:0 0 8px 0;font-size:17px;font-weight:700;color:var(--text-primary);line-height:1.3;padding-right:24px}
.set-card .count{margin:0;color:var(--text-secondary);font-size:13px}
.dotbtn{
  position:absolute;top:12px;right:12px;
  background:transparent;border:none;color:var(--text-tertiary);
  cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);
  font-size:18px;line-height:1;
}
.dotbtn:hover{background:var(--surface-3);color:var(--text-primary)}
.menu{
  display:none;position:absolute;top:40px;right:8px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;z-index:20;
  box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:140px;
}
.menu button{
  display:flex;width:100%;text-align:left;border:none;border-bottom:1px solid var(--border-subtle);
  background:transparent;padding:11px 16px;font-size:13px;color:var(--text-primary);
  border-radius:0;height:auto;
}
.menu button:last-child{border-bottom:none}
.menu button:hover{background:var(--surface-3)}
.menu .danger{color:var(--danger)}
.menu .danger:hover{background:rgba(240,68,82,.08)}

/* ── Sidebar ── */
.sidebar{
  width:280px;border-right:1px solid var(--border);
  background:var(--surface-1);padding:16px 12px;
  display:flex;flex-direction:column;gap:12px;overflow:hidden;
}
.sidebar .head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.sidebar .title{font-size:15px;font-weight:700;color:var(--text-primary)}
.sidebar .head-actions{display:flex;gap:4px}
.q-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.q-item{
  border:1px solid transparent;border-radius:var(--radius-md);
  background:transparent;padding:10px 10px;
  display:flex;align-items:center;gap:8px;cursor:pointer;
  transition:.12s;
}
.q-item:hover{background:var(--surface-2);border-color:var(--border)}
.q-item.selected{background:var(--blue-subtle);border-color:var(--blue-dim)}
.q-item .num{
  font-family:var(--num-serif);font-variant-numeric:tabular-nums;
  color:var(--blue);min-width:38px;text-align:right;margin-right:2px;
  white-space:nowrap;font-size:13px;font-weight:700;line-height:1.2;
}
.q-item.selected .num{color:#7BB8FF}
.q-item .num .sub{font-size:9px;vertical-align:baseline;opacity:.75}
.q-item .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--text-secondary)}
.q-item.selected .name{color:var(--text-primary)}
.iconbtn{
  background:transparent;border:none;cursor:pointer;
  padding:5px;border-radius:var(--radius-sm);
  color:var(--text-tertiary);flex-shrink:0;
}
.iconbtn:hover{background:var(--surface-3);color:var(--text-secondary)}
.icon{width:16px;height:16px;display:inline-block;vertical-align:middle}
.icon-trash{background:no-repeat center/16px 16px url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" stroke="%238B8B9A" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5h11"/><path d="M7 5V3.5h4V5"/><path d="M5.5 5l.6 9.5A1.5 1.5 0 0 0 7.6 16h2.8a1.5 1.5 0 0 0 1.5-1.5L12.5 5"/></svg>')}
.icon-grip{background:no-repeat center/16px 16px url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" stroke="%238B8B9A" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="0.9"/><circle cx="12" cy="6" r="0.9"/><circle cx="6" cy="10" r="0.9"/><circle cx="12" cy="10" r="0.9"/><circle cx="6" cy="14" r="0.9"/><circle cx="12" cy="14" r="0.9"/></svg>')}
.icon-link{background:no-repeat center/14px 14px url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%238B8B9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>')}
.icon-unlink{background:no-repeat center/15px 15px url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="%23C26B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12" stroke-dasharray="2 2"/></svg>')}
.icon-undo{background:no-repeat center/18px 18px url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23C9C9D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H9"/></svg>')}
.icon-redo{background:no-repeat center/18px 18px url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23C9C9D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5h6"/></svg>')}
.histbtn{width:34px;height:34px;padding:0;border-radius:9px}
.histbtn:disabled{opacity:.32;cursor:not-allowed}
.histbtn:disabled:hover{background:transparent}
.ai-dropzone{
  width:100%;box-sizing:border-box;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:16px 14px;border-radius:14px;
  border:1.5px dashed color-mix(in srgb, var(--blue) 55%, var(--border));
  background:color-mix(in srgb, var(--blue) 7%, transparent);
  transition:.18s ease;text-align:center;
}
.ai-dropzone:hover{
  border-color:var(--blue);
  background:color-mix(in srgb, var(--blue) 12%, transparent);
}
.ai-dropzone.dragover{
  border-color:var(--blue);border-style:solid;
  background:color-mix(in srgb, var(--blue) 18%, transparent);
  transform:scale(1.01);
}
.ai-dz-icon{font-size:22px;line-height:1}
.ai-dz-main{font-size:14px;font-weight:700;color:var(--text-primary)}
.ai-dz-sub{font-size:11.5px;color:var(--text-tertiary)}
.ai-dropzone.busy{opacity:.6;pointer-events:none}
.add-q{
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:1.5px dashed var(--border);background:transparent;
  border-radius:var(--radius-md);padding:10px;
  font-size:13px;color:var(--text-tertiary);cursor:pointer;
  transition:.12s;margin-top:4px;
}
.add-q:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-subtle)}

/* ── Pair group ── */
.pair-group{position:relative;padding-left:16px;display:flex;flex-direction:column;gap:3px;margin:2px 0}
.pair-group::before{
  content:'';position:absolute;left:4px;top:12px;bottom:12px;
  width:2px;background:linear-gradient(180deg,var(--blue),#7BB8FF);
  border-radius:2px;
}
.pair-badge{font-size:10px;color:var(--blue);display:flex;align-items:center;gap:6px;padding-bottom:3px;font-weight:600;letter-spacing:.03em}
.pair-unlink{
  background:transparent;border:1px solid var(--blue-dim);
  border-radius:6px;color:var(--blue);font-size:10px;
  cursor:pointer;padding:1px 7px;height:auto;
  transition:.12s;font-family:var(--ui-sans);
}
.pair-unlink:hover{background:var(--blue-subtle)}

/* ── Center editor ── */
.center{flex:1;display:flex;flex-direction:column;padding:20px;gap:14px;overflow:auto;background:var(--bg)}
.blockbar{display:flex;align-items:center;gap:8px}
select{
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-primary);padding:8px 12px;
  border-radius:var(--radius-md);font-size:13px;
  font-family:var(--ui-sans);appearance:none;outline:none;
  cursor:pointer;transition:.15s;
}
select:focus{border-color:var(--blue)}

/* ── Editor meta fields ── */
.meta-row{display:flex;flex-direction:column;gap:8px}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-label{font-size:11px;font-weight:600;color:var(--text-tertiary);letter-spacing:.04em;text-transform:uppercase}
.field-input{
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-primary);border-radius:var(--radius-md);
  padding:9px 12px;font-size:13px;font-family:var(--ui-sans);
  outline:none;transition:.15s;width:100%;
}
.field-input:focus{border-color:var(--blue);background:var(--surface-3)}
.field-input::placeholder{color:var(--text-tertiary)}

/* ── Block editor ── */
.block{
  border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--surface-1);overflow:hidden;
  transition:border-color .15s;
}
.block:hover{border-color:#35353F}
.block+.block{margin-top:10px}
.blk-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:var(--surface-2);
  border-bottom:1px solid var(--border);
}
.blk-type{
  font-size:12px;font-weight:700;
  color:var(--text-secondary);letter-spacing:.03em;flex:1;
}
.blk-handle{
  cursor:grab;padding:4px;border-radius:6px;
  color:var(--text-tertiary);
}
.blk-handle:active{cursor:grabbing}
.blk-sep{display:none}
.blk-body{padding:12px 14px}
.block textarea{
  width:100%;min-height:120px;resize:none;
  background:var(--surface-3);border:1px solid var(--border);
  color:var(--text-primary);border-radius:var(--radius-md);
  padding:10px 12px;overflow:hidden;font-size:13px;
  font-family:'Pretendard Variable',Pretendard,monospace;
  line-height:1.6;outline:none;transition:.15s;
}
.block textarea:focus{border-color:var(--blue);background:var(--surface-2)}
.block input{
  flex:1;background:var(--surface-3);border:1px solid var(--border);
  color:var(--text-primary);border-radius:var(--radius-md);
  padding:8px 12px;font-size:13px;font-family:var(--ui-sans);
  outline:none;transition:.15s;
}
.block input:focus{border-color:var(--blue)}
.block .row{display:flex;gap:8px;align-items:center;margin:6px 0}
.block .label{min-width:24px;color:var(--text-secondary);font-size:13px;font-weight:600}

#qAnswer{
  flex:1;resize:vertical;min-height:40px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-primary);border-radius:var(--radius-md);
  padding:8px 12px;font-size:13px;
  font-family:'Pretendard Variable',Pretendard,monospace;
  outline:none;transition:.15s;
}
#qAnswer:focus{border-color:var(--blue)}

/* ── Preview ── */
.previewWrap{width:500px;border-left:1px solid var(--border);background:var(--surface-1);display:flex;flex-direction:column;overflow:hidden}
.previewTop{
  padding:12px 18px;border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface-2);font-weight:600;
}
.previewArea{padding:20px;overflow:auto;flex:1;background:var(--bg)}
.preview{
  background:#fff;color:#111;
  font-family:'KoPub Batang',var(--body-serif);
  padding:28px;border-radius:var(--radius-xl);
  box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.12);
}
.preview .qnum{
  font-family:var(--num-serif);font-size:26px;font-weight:800;
  color:#111;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;
}
.preview .content{font-size:13.2px;line-height:1.7;font-weight:400}
.preview .content .katex,.preview .content .katex *{font-weight:400!important}
.preview .content .katex-display{display:inline-block;margin:0.3em 0;text-align:left;font-size:1.08em}
.preview .content .pdm{text-align:center;margin:0.6em 0;display:block}
.preview .content .pdm .katex-display{display:block!important;text-align:center!important;margin:0}
.preview .boxed{
  border:1px solid #ddd;border-radius:10px;
  padding:8px 14px;background:#fafafa;margin:10px 0;
}
.preview .cond-item{margin:4px 0;display:flex;gap:0.4em;align-items:baseline}
.preview .ex-item{margin:4px 0;display:flex;gap:0.4em;align-items:baseline}
.cond-label,.ex-label{flex-shrink:0;white-space:nowrap}
.cond-text,.ex-text{flex:1}
.preview img{max-width:100%;display:block;margin:8px auto}
.preview .content .img-wrap{text-align:center}

/* Choices */
.choices{margin-top:8px}
.choices.vertical{display:grid;grid-template-columns:1fr;row-gap:8px}
.choices.horizontal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:12px;row-gap:8px}
.choices.horizontal.choices--wrap{grid-template-columns:repeat(auto-fit,minmax(34mm,1fr))}
.choices .choice{min-width:0}
.choices .choice .text{overflow-x:hidden}
.choice{display:flex;gap:6px;align-items:center;font-family:var(--body-serif)}
.choice span.label{white-space:nowrap;font-family:var(--num-serif);align-self:center}

/* ── Print ── */
@page{margin:0}
#printDoc{display:none}
.page{page-break-after:always;position:relative;width:210mm;min-height:297mm;padding:12mm 13mm 16mm 13mm;background:#fff;color:#000;font-family:var(--body-serif)}
.page .lines-top{position:absolute;left:10mm;right:10mm;top:12mm;height:0;border-top:1px solid #3b45bf}
.page .lines-mid{position:absolute;top:12mm;bottom:16mm;left:calc(50%);border-left:1px solid #3b45bf}
.page .lines-bot{position:absolute;left:10mm;right:10mm;bottom:16mm;height:0;border-bottom:1px solid #3b45bf}
.page .hdr-left{position:absolute;top:4.2mm;left:10mm;font-size:10.5pt;color:#333}
.page .ftr-brand{position:absolute;right:14mm;bottom:8mm;font-family:'Adobe Caslon Pro Bold',serif;font-size:11pt;letter-spacing:.3px}
.page .ftr-page{position:absolute;left:0;right:0;bottom:8mm;text-align:center;font-size:10pt;color:#333}

.columns{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--col-gap-mm)*1mm);padding-top:5mm;height:calc(297mm - 12mm - 5mm - 16mm)}
.slot{display:flex;flex-direction:column;height:100%}
.slot:nth-child(2){padding-left:4mm}
.slot--paired .pq{flex:1;min-height:0;overflow-x:hidden}
.pq{width:100%;margin:0;overflow-x:hidden}
.pq .content{font-family:'KoPub Batang',"Times New Roman",serif;font-size:calc(var(--print-fs-pt)*1pt);line-height:var(--print-lh);word-break:keep-all;font-weight:400}
.pq .content .katex,.pq .content .katex *{font-weight:400!important}
/* \text{} 안 한글 폰트 상속 */
.pq .content .katex .mord.text,.preview .content .katex .mord.text{font-family:'KoPub Batang','Noto Sans KR',sans-serif!important;font-size:0.92em}
/* $$...$$ 표 등 display 수식 살짝 크게 */

<script>
/* ===== Utils ===== */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e;};
const uid=()=>'q'+Math.random().toString(36).slice(2,9);
const sanitize=s=>(s||"").replaceAll("<","&lt;").replaceAll(">","&gt;");
const HANGULS=["가","나","다","라","마","바","사","아","자","차","카","타","파","하"];
const HSMALL=["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const condLabel=i=>`(${HANGULS[i%HANGULS.length]})`;
const circled=n=>"①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳".split("")[n-1]||n+'.';

/* ===== Firebase 초기화 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAaQHf_Um-eg7SReuJYgS517XfGmlmGJ3Y",
  authDomain: "pedagogy-huryul.firebaseapp.com",
  projectId: "pedagogy-huryul",
  storageBucket: "pedagogy-huryul.firebasestorage.app",
  messagingSenderId: "297266134873",
  appId: "1:297266134873:web:e5b48c7a1d484bcde41648"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
const fbStorage = firebase.storage();

/* ===== 이미지 저장 헬퍼 =====
   Spark(무료) 플랜에서는 Firebase Storage를 쓸 수 없어 업로드가 402/403으로 실패한다.
   그래서 이미지를 클라이언트에서 리사이즈 + JPEG 압축한 base64로 저장한다.
   인쇄 단 폭(~90mm)에는 가로 1400px이면 충분하고, 용량은 수십~수백 KB로 줄어
   Firestore 1MB 문서 한도 안에 여러 장이 들어간다. */
function isStorageUrl(s){ return typeof s==="string" && s.startsWith("http"); }
function isDataUrl(s){ return typeof s==="string" && s.startsWith("data:"); }

// dataURL 이미지를 canvas로 리사이즈 + 압축 → JPEG dataURL 반환
function compressDataUrl(dataUrl, maxDim=1400, quality=0.82){
  return new Promise((resolve)=>{
    if(!isDataUrl(dataUrl)) return resolve(dataUrl);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h) return resolve(dataUrl);
        const scale=Math.min(1, maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement("canvas");
        cv.width=w; cv.height=h;
        const ctx=cv.getContext("2d");
        ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);   // 투명 PNG → 흰 배경
        ctx.drawImage(img,0,0,w,h);
        const out=cv.toDataURL("image/jpeg", quality);
        // 압축 결과가 원본보다 작을 때만 사용 (이미 작은 이미지의 불필요한 열화 방지)
        resolve(out.length < dataUrl.length ? out : dataUrl);
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

// File → 압축 JPEG dataURL
async function compressImageFile(file, maxDim=1400, quality=0.82){
  const d=await fileToDataURL(file);
  return await compressDataUrl(d, maxDim, quality);
}

// File 객체를 받아 저장용 문자열(압축 base64) 반환
async function storeImageFile(file){
  if(!file) return "";
  try{ return await compressImageFile(file); }
  catch(e){ console.warn("이미지 압축 실패, 원본 사용:", e); return await fileToDataURL(file); }
}

// 모든 문제집에 박힌 큰 base64 이미지를 일괄 재압축 (용량 정리용). 압축한 장수 반환
async function compactAllImages(maxDim=1400, quality=0.82, threshold=200000){
  let changed=0;
  const tooBig=s=>isDataUrl(s) && s.length>threshold;   // 기본: 약 150KB 이상만 손봄
  for(const set of sets){
    for(const q of (set.problems||[])){
      if(tooBig(q.answerImg)){
        const c=await compressDataUrl(q.answerImg, maxDim, quality);
        if(c!==q.answerImg){ q.answerImg=c; changed++; }
      }
      for(const b of (q.blocks||[])){
        if(b && b.data && tooBig(b.data.dataUrl)){
          const c=await compressDataUrl(b.data.dataUrl, maxDim, quality);
          if(c!==b.data.dataUrl){ b.data.dataUrl=c; changed++; }
        }
      }
    }
  }
  return changed;
}

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error("파일 읽기 실패"));
    r.readAsDataURL(file);
  });
}

/* ===== Storage ===== */
const SETS_KEY="PM_SETS_V7";
let sets=[]; let currentSetId=null; let currentQId=null; let orderMode=false;
let currentUser=null; // 로그인 유저
let saveTimer=null;   // 디바운스용

function newProblem(){ return { id:uid(), title:"", desc:"", answer:"", answerImg:"", numLabel:"", paired:false, blocks:[{type:"statement",data:{text:""}}] }; }

function readLocalSets(){
  try{ const raw=localStorage.getItem(SETS_KEY); return raw?JSON.parse(raw):[]; }catch{ return []; }
}
function loadSetsLocal(){
  sets=readLocalSets();
  if(!sets.length) sets=[{id:uid(), name:"새 문제집", header:"", problems:[newProblem()]}];
}

// 한 문제집이 "실제 작업물"인지 판단: 이름이 기본값이 아니거나, 내용 있는 문제가 하나라도 있으면 true
function setHasContent(s){
  if(!s) return false;
  if(s.name && s.name!=="새 문제집") return true;
  return (s.problems||[]).some(q=>{
    if(q.title || q.desc || q.answer || q.answerImg || q.numLabel) return true;
    return (q.blocks||[]).some(b=>{
      const d=b.data||{};
      return (d.text&&d.text.trim()) || (d.items&&d.items.length) || (d.src);
    });
  });
}
function localSetsWorthMerging(localSets){
  return (localSets||[]).filter(setHasContent);
}
// 클라우드 sets에 로컬 sets 병합 (중복 id는 클라우드 우선, 새 id만 추가)
function mergeSets(cloudSets, localSets){
  const ids=new Set(cloudSets.map(s=>s.id));
  const added=localSets.filter(s=>!ids.has(s.id));
  return cloudSets.concat(added);
}

async function loadSets(){
  if(currentUser){
    try{
      const doc=await fbDb.collection('users').doc(currentUser.uid).get();
      const cloud=(doc.exists && Array.isArray(doc.data().sets))?doc.data().sets:[];
      const localWorth=localSetsWorthMerging(readLocalSets());

      if(cloud.length && localWorth.length){
        // 양쪽 다 있음 → 병합 여부 확인
        const merge=confirm(
          "이 컴퓨터에 로그인 전 작업한 문제집이 있습니다.\n"+
          "클라우드 문제집과 합칠까요?\n\n"+
          "[확인] 합치기 (로컬 작업도 계정에 추가)\n"+
          "[취소] 클라우드 문제집만 사용"
        );
        sets = merge ? mergeSets(cloud, localWorth) : cloud;
        if(merge) saveSets(); // 병합 결과를 클라우드에 반영
        return;
      }
      if(cloud.length){ sets=cloud; return; }
      if(localWorth.length){ sets=localWorth; saveSets(); return; } // 클라우드 비었으면 로컬을 올림
      // 둘 다 없으면 기본 문제집
    }catch(e){ console.warn('Firestore 로드 실패, 로컬 사용:', e); }
  }
  loadSetsLocal();
}

/* ===== Undo / Redo 히스토리 =====
   sets의 스냅샷을 스택에 쌓아 되돌리기/다시실행 지원.
   - 연속 타이핑은 디바운스로 하나의 단계로 묶음
   - undo/redo로 인한 변경은 기록하지 않음(isRestoring 플래그) */
let undoStack=[]; let redoStack=[];
let isRestoring=false;          // undo/redo 적용 중에는 새 기록 금지
let histTimer=null;
const HIST_LIMIT=80;            // 최대 보관 단계
let lastSnapshot=null;          // 직전에 기록한 스냅샷(중복 방지)

function snapshot(){ return JSON.stringify({sets, currentSetId, currentQId}); }

function pushHistory(){
  if(isRestoring) return;
  const snap=snapshot();
  if(snap===lastSnapshot) return;       // 변화 없으면 skip
  // 디바운스: 빠른 연속 변경은 마지막 것만 한 단계로
  clearTimeout(histTimer);
  const prev=lastSnapshot;
  histTimer=setTimeout(()=>{
    if(prev!==null){ undoStack.push(prev); if(undoStack.length>HIST_LIMIT) undoStack.shift(); }
    lastSnapshot=snapshot();
    redoStack=[];                         // 새 동작이 생기면 redo 무효화
    updateHistButtons();
  }, 350);
}

function applySnapshot(snap){
  try{
    const o=JSON.parse(snap);
    sets=o.sets; currentSetId=o.currentSetId; currentQId=o.currentQId;
  }catch{ return false; }
  return true;
}

function doUndo(){
  if(!undoStack.length) return;
  clearTimeout(histTimer);                // 대기 중 기록 취소
  isRestoring=true;
  const cur=snapshot();
  const prev=undoStack.pop();
  redoStack.push(cur);
  applySnapshot(prev);
  lastSnapshot=snapshot();
  localStorage.setItem(SETS_KEY, JSON.stringify(sets));
  // 화면 갱신
  refreshAfterHistory();
  isRestoring=false;
  updateHistButtons();
}

function doRedo(){
  if(!redoStack.length) return;
  clearTimeout(histTimer);
  isRestoring=true;
  const cur=snapshot();
  const next=redoStack.pop();
  undoStack.push(cur);
  applySnapshot(next);
  lastSnapshot=snapshot();
  localStorage.setItem(SETS_KEY, JSON.stringify(sets));
  refreshAfterHistory();
  isRestoring=false;
  updateHistButtons();
}

function refreshAfterHistory(){
  // 현재 보던 문제집/문항이 사라졌으면 안전하게 보정
  const s=sets.find(x=>x.id===currentSetId);
  if(!s){ // 문제집이 없어졌으면 라이브러리로
    if(typeof renderLibrary==="function") renderLibrary();
    if($("#libraryView").style.display!=="none"){ renderLibrary(); }
    else showLibrary();
    return;
  }
  if(!s.problems.some(p=>p.id===currentQId)) currentQId=s.problems[0]?.id||null;
  // 에디터가 떠있으면 에디터 갱신, 아니면 라이브러리 갱신
  if($("#editorView").style.display!=="none"){
    if(typeof renderQList==="function") renderQList();
    if(typeof renderEditor==="function") renderEditor();
    if(typeof renderPreview==="function") renderPreview();
    if(typeof syncPairedChk==="function") syncPairedChk();
    const hi=$("#headerInput"); if(hi) hi.value=s.header||"";
  }else{
    if(typeof renderLibrary==="function") renderLibrary();
  }
}

function updateHistButtons(){
  const u=$("#undoBtn"), r=$("#redoBtn");
  if(u) u.disabled=!undoStack.length;
  if(r) r.disabled=!redoStack.length;
}

function setSaveStatus(txt, color){
  const el=document.getElementById("saveStatus");
  if(!el) return;
  el.textContent=txt;
  el.style.color=color||"var(--text-tertiary)";
}

function saveSets(){
  // 변경 사항을 히스토리에 기록 (디바운스)
  pushHistory();
  // 로컬 항상 저장 (백업)
  try{
    localStorage.setItem(SETS_KEY, JSON.stringify(sets));
  }catch(e){
    // localStorage도 용량 초과 가능 (base64 이미지 많을 때)
    console.error("로컬 저장 실패:", e);
    setSaveStatus("⚠ 로컬 저장 실패", "#e57373");
  }
  // 로그인 시 Firestore에 디바운스 저장 (0.8초 대기 후)
  if(currentUser){
    setSaveStatus("저장 중…", "var(--text-tertiary)");
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async ()=>{
      try{
        // 저장 전 문서 크기 점검 (Firestore 문서 한도 1MiB) — 크면 이미지 자동 압축
        let bytes=new Blob([JSON.stringify(sets)]).size;
        if(bytes > 950000){
          setSaveStatus("이미지 압축 중…", "var(--text-tertiary)");
          await compactAllImages(1400,0.82,200000);
          bytes=new Blob([JSON.stringify(sets)]).size;
          if(bytes > 950000){ await compactAllImages(1000,0.70,0); bytes=new Blob([JSON.stringify(sets)]).size; }
          try{ localStorage.setItem(SETS_KEY, JSON.stringify(sets)); }catch(_){}
          if($("#editorView").style.display!=="none" && typeof renderPreview==="function") renderPreview();
        }
        await fbDb.collection('users').doc(currentUser.uid).set({ sets, updatedAt: new Date() });
        setSaveStatus("✓ 저장됨", "#81c784");
        setTimeout(()=>setSaveStatus(""), 2000);
      }catch(e){
        console.error('Firestore 저장 실패:', e);
        // 에러 종류 구분
        let msg="⚠ 저장 실패";
        const es=String(e?.message||e);
        if(/permission|insufficient|PERMISSION/i.test(es)) msg="⚠ 권한 오류";
        else if(/longer than|exceeds|too large|1048487|maximum/i.test(es)) msg="⚠ 용량 초과";
        setSaveStatus(msg, "#e57373");
      }
    }, 800);
  }
}
const activeSet=()=>sets.find(s=>s.id===currentSetId);
const activeProblems=()=>activeSet()?.problems||[];
const activeQ=()=>activeProblems().find(q=>q.id===currentQId);

/* 자동 번호 부여: 묶음 여부 관계없이 순차 번호, numLabel 있으면 우선 */
function computeNums(arr){
  const res=[]; let main=0;
  arr.forEach(q=>{
    main++;
    res.push({q, num: q.numLabel||String(main).padStart(2,'0')});
  });
  return res;
}

function renderLibrary(){
  const grid=$("#setGrid"); grid.innerHTML="";
  sets.forEach((s,idx)=>{
    const card=el("div","set-card");
    const title=el("h3",null,s.name||"제목 없음");
    const count=el("p","count",`${(s.problems?.length||0)} 문항`);
    card.append(title,count);

    const dots=el("button","dotbtn","⋮"); card.append(dots);
    const menu=el("div","menu");
    const bRename=el("button",null,"이름 변경");
    const bDup=el("button",null,"복제");
    const bExp=el("button",null,"내보내기");
    const bDel=el("button","danger","삭제");
    menu.append(bRename,bDup,bExp,bDel); card.append(menu);

    dots.onclick=(e)=>{e.stopPropagation(); menu.style.display=menu.style.display==="block"?"none":"block";}
    document.addEventListener("click",()=>menu.style.display="none",{once:true});

    bRename.onclick=(e)=>{
      e.stopPropagation();
      title.contentEditable="true"; title.style.borderBottom="1px dashed #3a3f52";
      const sel=window.getSelection(); const range=document.createRange();
      range.selectNodeContents(title); sel.removeAllRanges(); sel.addRange(range); title.focus();
      const finish=()=>{
        title.contentEditable="false"; title.style.borderBottom="none";
        s.name=title.innerText.trim()||"제목 없음"; saveSets(); renderLibrary();
      };
      title.onblur=finish; title.onkeydown=ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); title.blur(); } };
    };

    card.onclick=()=>showEditor(s.id);
    bDup.onclick=(e)=>{e.stopPropagation(); const cp=JSON.parse(JSON.stringify(s)); cp.id=uid(); cp.name=(s.name||"문제집")+" 복제"; sets.splice(idx+1,0,cp); saveSets(); renderLibrary();};
    bExp.onclick=(e)=>{e.stopPropagation(); const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(s.name||"set")+".json"; a.click(); };
    bDel.onclick=(e)=>{e.stopPropagation(); if(!confirm("삭제할까요?")) return; sets.splice(idx,1); if(!sets.length) sets=[{id:uid(),name:"새 문제집",header:"",problems:[newProblem()]}]; saveSets(); renderLibrary(); };

    grid.append(card);
  });
}
function showLibrary(){ $("#libraryView").style.display="block"; $("#editorView").style.display="none"; $("#topActions").style.visibility="hidden"; renderLibrary(); }
$("#newSetBtn").onclick=()=>{ sets.push({id:uid(), name:"새 문제집", header:"", problems:[newProblem()]}); saveSets(); renderLibrary(); };
$("#exportAllBtn").onclick=()=>{ const blob=new Blob([JSON.stringify(sets,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="pedagogy_sets.json"; a.click(); };
$("#importAllInput").onchange=e=>{ const f=e.target.files?.[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{
  const data=JSON.parse(r.result);
  const incoming=Array.isArray(data)?data:[data];
  if(!incoming.length){ alert("불러올 문제집이 없습니다."); return; }
  // 각 문제집을 새 id로 라이브러리에 추가 (기존 유지)
  let added=0;
  incoming.forEach(s=>{
    if(!s || !Array.isArray(s.problems)) return;
    const cp=JSON.parse(JSON.stringify(s));
    cp.id=uid();
    // 이름 충돌 시 표시
    const baseName=cp.name||"불러온 문제집";
    let name=baseName, n=2;
    while(sets.some(x=>x.name===name)){ name=`${baseName} (${n++})`; }
    cp.name=name;
    sets.push(cp); added++;
  });
  if(added){ saveSets(); renderLibrary(); alert(`${added}개의 문제집을 추가했습니다.`); }
  else alert("올바른 문제집 형식이 아닙니다.");
}catch{ alert("JSON 오류"); } }; r.readAsText(f); e.target.value=""; };

  currentSetId=setId;
  const s=activeSet(); if(!s.problems?.length) s.problems=[newProblem()];

}

/* 문항 리스트/정렬 */
let sortableQ=null;
function setOrderMode(on){
  orderMode=on; renderQList();
  if(on){
    if(sortableQ) sortableQ.destroy();
    sortableQ=new Sortable($("#qList"),{
      handle:".drag-handle", animation:150,
      onEnd:e=>{
        const arr=activeProblems();
        arr.splice(e.newIndex,0,arr.splice(e.oldIndex,1)[0]);
        saveSets(); renderQList(); renderPreview();
      }
    });
  }else if(sortableQ){ sortableQ.destroy(); sortableQ=null; }
}
$("#orderBtn").onclick=()=>setOrderMode(!orderMode);

/* 묶음에서 특정 문제를 독립시키고, 그 뒤를 한 칸씩 재배치
   예: (a,b)(c,d)(e,f)에서 a 독립 → a (b,c) (d,e) f */
function makeIndependent(arr, idx){
  if(idx<0 || idx>=arr.length) return;
  arr[idx].paired=false;        // 이 문제를 독립
  // idx+1부터 끝까지 앞에서부터 2개씩 새로 짝짓기
  let j=idx+1;
  while(j<arr.length){
    if(j<arr.length-1){ arr[j].paired=true; arr[j+1].paired=false; j+=2; }
    else { arr[j].paired=false; j+=1; }
  }
}

function renderQList(){
  const list=$("#qList"); list.innerHTML="";
  const arr=activeProblems();
  const nums=computeNums(arr);
  const fmtNum=raw=>{ const m=raw.match(/^(.+?)(-\d+)$/); return m?`${m[1]}<span class="sub">${m[2]}</span>`:raw; };
  const numOf=q=>{ const n=nums.find(x=>x.q===q); return n?fmtNum(n.num):"??"; };

  const mkItem=(q,opts={})=>{
    const item=el("div","q-item"+(q.id===currentQId?" selected":""));
    const num=el("div","num",numOf(q));
    const name=el("div","name",q.title||"제목 없음");
    item.append(num,name);
    if(orderMode){
      const grip=el("button","iconbtn drag-handle",""); grip.append(el("span","icon icon-grip","")); item.append(grip);
    }else{
      if(opts.showLink){
        const lb=el("button","iconbtn",""); lb.title="다음 문제와 묶기 (한 단에 2문제)"; lb.append(el("span","icon icon-link",""));
        lb.onclick=(e)=>{e.stopPropagation(); q.paired=true; saveSets(); renderQList(); syncPairedChk();};
        item.append(lb);
      }
      if(opts.showUnlink){
        const ub=el("button","iconbtn",""); ub.title="이 문제를 한 단에 독립 (뒤 문제는 다시 묶임)"; ub.append(el("span","icon icon-unlink",""));
        ub.onclick=(e)=>{e.stopPropagation(); const fi=arr.findIndex(x=>x.id===q.id); if(fi<0) return;
          makeIndependent(arr, fi); saveSets(); renderQList(); syncPairedChk();};
        item.append(ub);
      }
      const del=el("button","iconbtn",""); del.title="삭제"; del.append(el("span","icon icon-trash",""));
      del.onclick=(e)=>{e.stopPropagation(); const fi=arr.findIndex(x=>x.id===q.id); if(fi<0) return;
        if(!confirm("문항을 삭제할까요?")) return;
        if(fi>0 && arr[fi-1].paired) arr[fi-1].paired=false;
        arr.splice(fi,1); if(!arr.length) arr.push(newProblem()); currentQId=arr[0].id; saveSets(); renderQList(); renderPreview(); syncPairedChk();};
      item.append(del);
    }
    item.onclick=()=>{ if(orderMode) return; currentQId=q.id; renderQList(); renderEditor(); renderPreview(); syncPairedChk(); };
    return item;
  };

  if(orderMode){
    arr.forEach(q=>list.append(mkItem(q,{})));
  } else {
    let i=0;
    while(i<arr.length){
      if(i<arr.length-1 && arr[i].paired){
        // 2개 or 3개 묶음
        const is3 = i+1<arr.length-1 && arr[i+1].paired && i+2<arr.length;
        const group=el("div","pair-group");
        const badge=el("div","pair-badge","⬝ 한 단");
        const ulk=el("button","pair-unlink","묶기 해제");
        const pairIdx=i;
        ulk.onclick=(e)=>{
          e.stopPropagation();
          arr[pairIdx].paired=false;
          if(is3) arr[pairIdx+1].paired=false;
          saveSets(); renderQList(); syncPairedChk();
        };
        badge.append(ulk); group.append(badge);
        group.append(mkItem(arr[i],{showLink:false, showUnlink:true}));
        // 2번째: 3개가 아니면 묶기 버튼 표시, 독립 버튼도 제공
        group.append(mkItem(arr[i+1],{showLink:!is3 && i+1<arr.length-1, linkLabel:"3번째 추가", showUnlink:true}));
        if(is3) group.append(mkItem(arr[i+2],{showLink:false, showUnlink:true}));
        list.append(group);
        i += is3 ? 3 : 2;
      }else{
        list.append(mkItem(arr[i],{showLink:i<arr.length-1}));
        i++;
      }
    }
  }

  const addBtn=el("div","add-q","+ 문항 추가");
  addBtn.onclick=()=>{ const np=newProblem(); activeSet().problems.push(np); currentQId=np.id; saveSets(); renderQList(); renderEditor(); renderPreview(); syncPairedChk(); };
  list.append(addBtn);
}

function autoSizeTA(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }

  $("#qTitle").value=q.title; $("#qDesc").value=q.desc;

  $("#qDesc").oninput=e=>{ q.desc=e.target.value; renderPreview(); saveSets(); };
  $("#qAnswer").oninput=e=>{ q.answer=e.target.value; renderPreview(); saveSets(); };

  // 정답 이미지

  imgClear.onclick=()=>{ q.answerImg=""; saveSets(); imgClear.style.display="none"; renderPreview(); };

  const area=$("#blocksArea"); area.innerHTML="";
  q.blocks.forEach((blk,idx)=>{
    const wrap=el("div","block");
    const head=el("div","blk-head");

    const BLK_LABELS={statement:"문제 본문",conditions:"가나다 조건",examples:"ㄱㄴㄷ 보기",boxed:"박스형 해설",choices:"답 선지",image:"이미지"};
    const type=el("div","blk-type",BLK_LABELS[blk.type]||blk.type);
    head.append(handle,type);

    if(blk.type==="choices"){
      if(!blk.data.layout) blk.data.layout="horizontal";
      const ctrl=el("div",null,""); ctrl.style.cssText="display:flex;gap:6px";
      const btnV=el("button","btn","↕ 세로");
      const btnH=el("button","btn","↔ 가로");
      const sync=()=>{ btnV.classList.toggle("btn-primary", blk.data.layout==="vertical"); btnH.classList.toggle("btn-primary", blk.data.layout==="horizontal"); renderPreview(); saveSets(); };
      btnV.onclick=()=>{ blk.data.layout="vertical"; sync(); };
      btnH.onclick=()=>{ blk.data.layout="horizontal"; sync(); };
      ctrl.append(btnV,btnH); head.append(ctrl); sync();

      if(blk.type!=="choices") body.append(add);

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]); // data URL 앞부분 제거
    r.onerror=()=>rej(new Error("파일 읽기 실패"));
    r.readAsDataURL(file);
  });
}

// AI 응답(JSON)을 편집기 블록 구조로 변환
function aiBlocksToProblem(p){
  const blocks=[];
  (p.blocks||[]).forEach(b=>{
    if(b.type==="statement"||b.type==="boxed"){
      blocks.push({type:b.type, data:{text:b.text||""}});
    }else if(b.type==="conditions"||b.type==="examples"){
      const items=(b.items&&b.items.length)?b.items:[""];
      blocks.push({type:b.type, data:{items}});
    }else if(b.type==="choices"){
      const items=(b.items||[]).slice(0,5);
      while(items.length<5) items.push("");
      blocks.push({type:"choices", data:{items, layout:"horizontal"}});
    }
  });
  if(!blocks.length) blocks.push({type:"statement", data:{text:""}});
  return { id:uid(), title:p.title||"", desc:"", answer:"", answerImg:"", numLabel:"", paired:false, blocks };
}

/* ─── 텍스트 전처리: \[Npt] 줄간격 + \n 자동 6pt + \displaystyle 자동 주입 ─── */
function autoDisplayStyle(raw){
  // 인라인 $...$ 안에 \int \sum \prod \lim 있으면 \displaystyle 자동 삽입
  return raw.replace(/\$((?:[^$\\]|\\[\s\S])+?)\$/g,(match,inner)=>{
    if(/\\(int|sum|prod|lim)\b/.test(inner)&&!/\\displaystyle/.test(inner))
      return '$\\displaystyle '+inner+'$';
    return match;
  });
}
/* cases 환경의 행간을 넓혀 위/아래 수식이 붙어 보이지 않게.
   각 행 시작에 보이지 않는 세로 버팀목(\rule)을 삽입.
   - \hline이 든 표(array)는 건드리지 않음(표는 행간 조정 불필요/깨질 수 있음)
   - 이미 \rule이 있으면 중복 삽입 안 함 */
function addCasesRowGap(src){
  if(!src || src.indexOf("\\begin{cases}")<0) return src;
  const STRUT="\\rule[-0.45em]{0pt}{1.45em}";
  return src.replace(/\\begin\{cases\}([\s\S]*?)\\end\{cases\}/g, (whole, body)=>{
    if(body.indexOf("\\rule")>=0 || body.indexOf("\\hline")>=0) return whole; // 이미 손댄 것/표는 패스
    // 행을 \\ 기준으로 나눠 각 행 앞에 버팀목 삽입
    const rows=body.split(/\\\\/);
    const newBody=rows.map(r=>{
      if(r.trim()==="") return r;
      // 행 맨 앞 공백 뒤에 버팀목 추가
      return r.replace(/^(\s*)/, "$1"+STRUT+" ");
    }).join("\\\\");
    return "\\begin{cases}"+newBody+"\\end{cases}";
  });
}

function processText(raw){
  const text=addCasesRowGap(autoDisplayStyle(raw||""));

  // ① $$...$$ 블록을 먼저 플레이스홀더로 교체 (sanitize에 넘기지 않음)
  const displayBlocks=[];
  const withPH=text.replace(/\$\$([\s\S]+?)\$\$/g,(match,math)=>{
    const i=displayBlocks.length;
    displayBlocks.push(math);
    return `\x01PDM${i}\x01`;
  });

  // ② \n → \[6pt], split → spacer HTML
  const normalized=withPH.replace(/\r?\n/g,'\\[6pt]');
  const parts=normalized.split(/\\{1,2}\[(\d+(?:\.\d+)?pt)\]/);
  let html='';
  parts.forEach((chunk,i)=>{
    if(i%2===0) html+=sanitize(chunk);
    else html+=`<span class="vspace" style="display:block;height:${chunk}"></span>`;
  });

  // ③ 플레이스홀더를 .pdm 래퍼로 복원 (KaTeX가 $$ 처리)
  html=html.replace(/\x01PDM(\d+)\x01/g,(m,i)=>{
    return `<div class="pdm">$$${displayBlocks[+i]}$$</div>`;
  });

  return html;
}

    return `<div class="boxed">${items}</div>`;

    return `<div class="boxed">${items}</div>`;

/* 컨테이너 폭을 넘치는 display 수식을 가로 축소 (미리보기/공용) */
function fitMathIn(root){
  if(!root) return;
  const avail=root.clientWidth;
  if(!avail) return;
  root.querySelectorAll(".katex-display").forEach(disp=>{
    const inner=disp.querySelector(".katex")||disp.firstElementChild;
    if(!inner) return;
    // 이전 축소 초기화 후 자연 폭 측정
    inner.style.transform=""; inner.style.display=""; inner.style.height="";
    const natural=inner.scrollWidth;
    const box=disp.clientWidth||avail;
    const limit=Math.min(box, avail)*0.98;
    if(natural>limit+3 && natural>0){
      const k=limit/natural;
      inner.style.display="inline-block";
      inner.style.transformOrigin="left center";
      inner.style.transform=`scale(${k.toFixed(4)})`;
      inner.style.height=(inner.offsetHeight*k)+"px";
      disp.style.overflow="visible";
    }
  });
}

/* Print builder */
function buildPrintDoc(hideAnswers){
  const s=activeSet(); if(!s) return;
  s.header=$("#headerInput").value||s.header||"";

  const qs=s.problems.slice();
  const nums=computeNums(qs);
  const numOf=q=>nums.find(n=>n.q===q)?.num||"??";

  // 슬롯 구성
  const slots=[];
  let i=0;
  while(i<qs.length){
    if(qs[i].paired && i+1<qs.length){
      if(qs[i+1].paired && i+2<qs.length){
        slots.push([qs[i],qs[i+1],qs[i+2]]); i+=3;
      } else {
        slots.push([qs[i],qs[i+1]]); i+=2;
      }
    } else {
      slots.push([qs[i]]); i++;
    }
  }
  const pages=[];
  for(let j=0;j<slots.length;j+=2) pages.push({left:slots[j], right:slots[j+1]||null});

  const wrap=$("#printDoc"); wrap.innerHTML="";
  pages.forEach((p,pi)=>{
    const page=el("div","page");
    page.append(el("div","lines-top"),el("div","lines-mid"),el("div","lines-bot"));
    page.append(el("div","hdr-left",s.header||""),el("div","ftr-brand","PEDAGOGY"),el("div","ftr-page",String(pi+1)));
    const cols=el("div","columns");

    const renderSlot=(slot)=>{
      const holder=el("div","slot"+(slot&&slot.length>1?" slot--paired":""));
      if(!slot){ cols.append(holder); return; }
      slot.forEach(q=>{
        const box=el("div","pq");
        const num=numOf(q);
        const metaHtml=(q.title||q.desc)?`<div style="display:flex;flex-direction:column;gap:0.3mm;justify-content:center"><span style="font-family:'KoPub Batang','Times New Roman',serif;font-size:9pt;font-weight:500;color:#555">${sanitize(q.title)}${q.desc?` <span style="color:#888;font-weight:400">· ${sanitize(q.desc)}</span>`:""}</span></div>`:"";
        const ansHtml=(q.answer||q.answerImg)&&!hideAnswers?`<div class="answer-block">정답: ${q.answer?`<span class="ans-text">${sanitize(q.answer)}</span>`:""}${q.answerImg?`<img class="answer-img" src="${q.answerImg}">`:" "}</div>`:"";
        box.innerHTML=`<div class="pq-header"><div class="num">${num}</div>${metaHtml}</div><div class="content">${q.blocks.map(blockHTML).join("")}${ansHtml}</div>`;
        holder.append(box);
      });
      cols.append(holder);
    };

    renderSlot(p.left); renderSlot(p.right);
    page.append(cols); wrap.append(page);
  });

  try{
    renderMathInElement(wrap,{
      delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:true}],
      throwOnError:false
    });
  }catch(e){}
}

// 키보드 단축키: Cmd/Ctrl+Z (undo), Cmd/Ctrl+Shift+Z 또는 Ctrl+Y (redo)
document.addEventListener("keydown",(e)=>{
  const mod=e.metaKey||e.ctrlKey; if(!mod) return;
  const k=e.key.toLowerCase();
  // 입력창에서 타이핑 중 텍스트 자체 되돌리기는 브라우저 기본에 맡김(단, 필드 밖이면 전역 undo)
  const tag=(e.target.tagName||"").toLowerCase();
  const inField = tag==="input"||tag==="textarea"||e.target.isContentEditable;
  if(k==="z"&&!e.shiftKey){ if(inField) return; e.preventDefault(); doUndo(); }
  else if((k==="z"&&e.shiftKey)||k==="y"){ if(inField&&k==="z") return; e.preventDefault(); doRedo(); }
});
$("#loadInput").onchange=e=>{ const f=e.target.files?.[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{
  const data=JSON.parse(r.result);

  // 불러온 모든 문제집의 문제를 한 줄로 모음
  const newProbs=[];
  incoming.forEach(s=>{ if(s&&Array.isArray(s.problems)) s.problems.forEach(p=>newProbs.push(p)); });
  if(!newProbs.length){ alert("불러올 문제가 없습니다."); return; }
  const s=activeSet();
  if(!s){ alert("문제집을 먼저 선택하세요."); return; }
  // id 재발급 + 안전하게 깊은 복사 (id 충돌 방지)
  const cloned=newProbs.map(p=>{ const cp=JSON.parse(JSON.stringify(p)); cp.id=uid(); return cp; });
  // 삽입된 묶음이 기존과 잘못 이어지지 않도록, 첫 문제 직전 경계 정리: 마지막 삽입 문제는 독립
  if(cloned.length) cloned[cloned.length-1].paired=false;

  let at=arr.findIndex(x=>x.id===currentQId);
  at = at<0 ? arr.length : at+1;
  // 삽입 지점 직전 문제가 paired면, 경계가 깨지지 않게 그대로 두되
  // 삽입으로 인해 직전 문제의 짝이 바뀌는 것을 막기 위해 직전 문제 독립 처리
  if(at>0 && at<=arr.length && arr[at-1] && arr[at-1].paired) arr[at-1].paired=false;
  arr.splice(at, 0, ...cloned);
  currentQId=cloned[0].id;
  saveSets(); renderQList(); renderEditor(); renderPreview(); syncPairedChk();
  alert(`${cloned.length}개의 문항을 현재 위치 뒤에 추가했습니다.`);
}catch{ alert("JSON 오류"); } }; r.readAsText(f); e.target.value=""; };

/* KaTeX 수식 폰트를 인쇄 전에 모두 강제 로드.
   (CSS는 lazy 로드라, 화면에 안 쓰인 굵기/기호 폰트가 인쇄 때 누락되면
    브라우저가 시스템 폰트로 굵게 합성해 수식이 두껍고 어색해짐) */
async function ensureKatexFonts(){
  if(!document.fonts||!document.fonts.load) return;
  // KaTeX 수식 폰트 (글자 지정 없이 로드)
  const specs=[
    "10px KaTeX_Main","italic 10px KaTeX_Main","700 10px KaTeX_Main",
    "10px KaTeX_Math","italic 10px KaTeX_Math",
    "10px KaTeX_Size1","10px KaTeX_Size2","10px KaTeX_Size3","10px KaTeX_Size4",
    "10px KaTeX_AMS","10px KaTeX_Caligraphic","10px KaTeX_Fraktur",
    "10px KaTeX_SansSerif","10px KaTeX_Script","10px KaTeX_Typewriter"
  ];
  // 본문 한글 폰트(KoPub 바탕)는 한글 글자를 지정해야 깨어남.
  // 이게 빠지면 인쇄 시 시스템 고딕으로 fallback되어 본문이 두껍게 나옴.
  const ko="가나다라마바사아자차카타파하각간갇갈값의해를할때년월일";
  const koSpecs=[
    ["400 12px 'KoPub Batang'",ko],
    ["700 12px 'KoPub Batang'",ko],
    ["400 12px 'KoPub Batang'","ABC123"]
  ];
  try{
    await Promise.all([
      ...specs.map(s=>document.fonts.load(s).catch(()=>{})),
      ...koSpecs.map(([s,txt])=>document.fonts.load(s,txt).catch(()=>{}))
    ]);
  }catch{}
}

async function doPrint(hideAnswers){
  modal.style.display="none";
  buildPrintDoc(hideAnswers);
  // KaTeX 수식 폰트를 모두 깨운 뒤 렌더/측정해야 인쇄에서 누락 없음
  await ensureKatexFonts();
  await new Promise(r=>requestAnimationFrame(r));
  if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch{} }
  await new Promise(r=>requestAnimationFrame(r));
  fitPrintDoc();
  await new Promise(r=>requestAnimationFrame(r));
  window.print();
}

/* ── 인쇄 레이아웃 보정 ──
   (1) 칸보다 넓은 가로 선지(choices) → 자동 줄바꿈, 그래도 넓으면 개별 축소
   (2) 칸보다 넓은 display 수식/표(array) → 가로 축소
   (3) 칸 높이를 넘치는 문제 → 전체 축소(fallback) */
function fitPrintDoc(){
  const wrap=$("#printDoc");
  const slotRight=(node)=>{ const s=node.closest(".slot"); return s?s.getBoundingClientRect().right:null; };

  // (1) 가로 선지: 칸 오른쪽 경계를 넘으면 먼저 줄바꿈 모드로 전환
  wrap.querySelectorAll(".pq .choices.horizontal").forEach(ch=>{
    const right=slotRight(ch); if(right==null) return;
    if(ch.getBoundingClientRect().right>right+1){
      ch.classList.add("choices--wrap");
    }
  });

  // (2) display 수식/표(.katex-display): 칸을 넘치면 그 수식만 가로 축소
  wrap.querySelectorAll(".pq .content .katex-display").forEach(disp=>{
    const right=slotRight(disp); if(right==null) return;
    const inner=disp.querySelector(".katex")||disp.firstElementChild;
    if(!inner) return;
    const r=inner.getBoundingClientRect();
    const dispLeft=disp.getBoundingClientRect().left;
    const avail=(right-dispLeft);
    if(r.width>avail+3 && r.width>0){           // 3px 이상 넘칠 때만 축소
      const k=(avail*0.99)/r.width;
      inner.style.display="inline-block";
      inner.style.transformOrigin="left center";
      inner.style.transform=`scale(${k.toFixed(4)})`;
      inner.style.height=(inner.offsetHeight*k)+"px";
      disp.style.overflow="visible";
    }
  });

  // (1-b) 줄바꿈 후에도 개별 선지의 수식이 칸을 넘으면 그 선지 내부만 축소
  wrap.querySelectorAll(".pq .choices .choice").forEach(choice=>{
    const right=slotRight(choice); if(right==null) return;
    const k=(()=>{ const w=choice.scrollWidth, avail=choice.clientWidth; return (w>avail&&avail>0)?avail/w:1; })();
    if(k<1){
      const txt=choice.querySelector(".text")||choice;
      txt.style.display="inline-block";
      txt.style.transformOrigin="left center";
      txt.style.transform=`scale(${(k*0.98).toFixed(4)})`;
    }
  });

  // (3) 세로 넘침: 칸 높이를 넘치면 그 칸의 문제들을 필요한 만큼만 축소
  wrap.querySelectorAll(".slot").forEach(slot=>{
    const limit=slot.clientHeight;
    if(!limit||slot.scrollHeight<=limit+1) return;
    const k=Math.max(0.72,(limit/slot.scrollHeight)*0.99);
    slot.querySelectorAll(".pq").forEach(pq=>{
      pq.style.transformOrigin="top left";
      pq.style.transform=`scale(${k.toFixed(4)})`;
      pq.style.width=(100/k).toFixed(2)+"%";
    });
  });
}

/* JSON 내보내기 — 다른 계정/기기에서 불러오기 가능한 형식 */
$("#exportJsonBtn").onclick=()=>{
  const s=activeSet(); if(!s){ alert("문제집을 먼저 선택하세요."); return; }
  const blob=new Blob([JSON.stringify([s],null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${s.name||"문제집"}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};

let authInitialized=false;
let prevUid=null;            // 직전 콜백의 uid (로그인/로그아웃 전환 감지용)
fbAuth.onAuthStateChanged(async (user)=>{
  currentUser=user;
  if(user){
    $("#authLoggedOut").style.display="none";
    $("#authLoggedIn").style.display="flex";
    $("#userPhoto").src=user.photoURL||"";
    $("#userName").textContent=user.displayName||user.email;
  }else{
    $("#authLoggedOut").style.display="block";
    $("#authLoggedIn").style.display="none";
  }

  const uid=user?user.uid:null;
  const userChanged=(uid!==prevUid);  // null→로그인, 로그인→로그아웃, 계정 전환 모두 감지
  prevUid=uid;

  if(!authInitialized){
    // 최초 로드: 비로그인이면 로컬, 로그인이면 Firestore 로드
    authInitialized=true;
    await loadSets();
    lastSnapshot=snapshot(); undoStack=[]; redoStack=[]; updateHistButtons();
    showLibrary();
  }else if(userChanged){
    // 이후 로그인/로그아웃/계정전환이 실제로 일어났을 때만 재로드
    // (토큰 갱신처럼 uid 그대로면 화면 안 건드림 → 작업 중 덮어쓰기 방지)
    await loadSets();
    lastSnapshot=snapshot(); undoStack=[]; redoStack=[]; updateHistButtons();
    showLibrary();
  }
});
