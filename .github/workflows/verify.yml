name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # ⚠️ **설치가 `check:fast` 보다 먼저 와야 한다.** `check:fast` 안의
      #    `test:cross:fast` 가 실제 브라우저를 띄운다 — 뒤에 두면 건너뛰기만 하고
      #    아무것도 검사하지 않는다(그리고 `XPLAT_REQUIRE=1` 이라 실패한다).
      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium
      - name: Fast code, fixture, and configuration checks
        env:
          XPLAT_REQUIRE: "1"        # 건너뜀은 통과가 아니다
        run: npm run check:fast
      # ⚠️ 기준 시각본은 **만든 OS 별로** 있다(`visual-baseline/<platform>/`).
      #    지금 저장소에는 맥(`darwin/`) 것만 있어서, 이 리눅스 러너에서는 비교를
      #    ⏭ 로 건너뛴다. 글리프 래스터화가 OS 마다 달라 맥 기준본과 견주면 글자마다
      #    어긋나 쪽의 1.8% 가 다르게 나오고 — 그건 진짜 배치 회귀(1.5%)보다도 커서
      #    아무것도 판정하지 못한다. 그래서 이 검사는 2026-08-28 이후 **19회 연속
      #    실패**했고 뒤 단계들이 아예 돌지 못했다(`REV-2026-018`).
      #    건너뛰어도 **인쇄 경로가 예외 없이 돌고 칸 넘침이 없는지는 확인한다** —
      #    렌더는 하고 비교만 건너뛰기 때문이다.
      #    리눅스에서도 견주고 싶으면 이 러너에서 UPDATE_VISUAL_BASELINE=1 로 한 번
      #    돌려 `visual-baseline/linux/` 를 만들어 커밋하면 된다.
      - name: Visual print regression
        run: npm run test:visual
      - name: Verify public artifact boundary (no deployment)
        run: npm run build:public && npm run check:public && npm run test:public-browser
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diff
          path: test-results/visual
          if-no-files-found: ignore
      - name: Firebase rules authorization tests
        run: npm run check:rules
      - name: Python server syntax
        run: python3 -c 'from pathlib import Path; compile(Path("serve.py").read_text(encoding="utf-8"), "serve.py", "exec")'
      - name: Whitespace errors
        run: git diff --check HEAD~1 HEAD

  # ── 환경 연기 검사 (세 엔진 × 세 뷰포트) ────────────────────────────────
  # 본 검사(verify)는 시간을 아끼려고 **크로미움 하나만** 돈다(`test:cross:fast`).
  # 세 엔진 전체는 여기서 돈다 — webkit·firefox 바이너리가 200MB 가까워 제품 검사
  # 작업에 얹으면 매 실행이 그만큼 느려진다.
  #
  # ⚠️ **여기가 초록불이어도 '모바일 대응 완료' 가 아니다.** Playwright 의 WebKit 은
  #    실제 iOS 사파리도 카카오 WebView 도 아니고 firefox 는 데스크톱 엔진이다.
  #    이것은 공통 DOM·CSS·JS 회귀를 잡는 1차선이다
  #    (`docs/CROSS-PLATFORM-DESIGN.md` §7).
  cross-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install all three engines
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Cross-platform smoke matrix
        env:
          XPLAT_REQUIRE: "1"
        run: npm run test:cross
      - name: CSP attribute enforcement and failure injection
        env:
          CSP_ENGINES: chromium,webkit,firefox
        run: npm run test:csp
      - name: Authentication navigation and attestation isolation
        env:
          AUTH_ENGINES: chromium,webkit,firefox
        run: npm run test:auth-navigation
      - name: External public scripts and strict script policy
        env:
          PUBLIC_ENGINES: chromium,webkit,firefox
        run: npm run test:public-browser

  # ── 한글(HWPX) 내보내기 — 베타 ──────────────────────────────────────────
  # 본 검사(verify)와 **분리된 작업**이다. 변환기 XML 의존성(lxml)은 제품 의존성이
  # 아니므로 제품 검사 환경에 섞지 않는다. 여기서만 venv 에 깔고, 여기서만 쓴다.
  # 이 작업을 통째로 지우면 예전 상태(= CI 에서 아무것도 검사하지 않음)로 돌아간다.
  #
  # ⚠️ HWPX_REQUIRE=1 이 핵심이다. 이게 없으면 의존성이 없을 때 '건너뛰고 통과' 라
  #    CI 는 아무것도 검사하지 않으면서 초록불이 된다 — 이 저장소가 세 번 겪은
  #    실패 방식이다. 설치가 깨지면 여기서 빨간불이 난다.
  #
  # ⚠️ 실물 틀(`평가원 수학 양식.hwpx`)은 저작물이라 저장소에 없다. 그래서 틀이 필요한
  #    검사(test_structure · test_sections · test_page_layout · test_style_roles)는 CI 에서
  #    ⏭ 로 건너뛴다. 러너가 건너뜀과
  #    통과를 구분해 찍으므로, 로그만 봐도 무엇이 실제로 돌았는지 알 수 있다.
  #    그 넷은 지금도 사람이 로컬에서 돌려야 한다.
  #
  # ⚠️ 그래서 **틀 없이 도는 경로를 반드시 함께 확인할 것.** 조판 결과에 경고를 하나
  #    더하면서 틀이 없을 때도 그 경고가 나오게 두면, `test_image_paths`·`test_endpoint`
  #    처럼 '경고 없음' 을 보는 검사가 **CI 에서만** 빨간불이 된다(실제로 그랬다).
  #    로컬에서 틀을 잠시 치우고 `HWPX_REQUIRE=1 npm run test:hwpx` 를 돌려 보면 된다.
  #
  # ⚠️ 브라우저로 실제 폭을 재는 대조(`test:hwpx-parity`)는 **일부러 걸지 않았다.**
  #    `measureCh()` 는 글꼴 실측이라 CI 리눅스와 개발 컴퓨터의 값이 다르고, 임계값에
  #    1mm 차로 붙은 선지가 있어 깜빡이는 검사가 된다. 대신 정답표에 편집기 규칙의
  #    지문을 적어 두고 `check:static` 이 낡음을 잡는다(그건 CI 에서 항상 돈다).
  hwpx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the beta converter dependencies
        run: |
          python3 -m venv .hwpxvenv
          .hwpxvenv/bin/pip install --disable-pip-version-check \
            -r experiments/hwp-export/requirements.txt
      - name: HWPX export checks
        env:
          # 상대 경로를 쓰면 검사가 experiments/hwp-export 를 작업 폴더로 자식을
          # 띄우는 자리에서 어긋난다. 절대 경로로 준다.
          HWPX_PYTHON: ${{ github.workspace }}/.hwpxvenv/bin/python
          HWPX_REQUIRE: '1'
        run: npm run test:hwpx
      # 브라우저 조판기(`hwpx-engine.js`)는 파이썬을 **옮겨 적은 사본**이다. 사본은
      # 갈라지므로 같은 입력으로 양쪽을 돌려 맞춰 본다. 이건 글꼴 실측이 아니라
      # XML 결과 대조라 `test:hwpx-parity` 와 달리 깜빡이지 않는다 — 그래서 CI 에 건다.
      - name: Install test dependencies for the browser comparison
        run: npm ci
      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser vs Python HWPX comparison
        env:
          HWPX_PYTHON: ${{ github.workspace }}/.hwpxvenv/bin/python
          HWPX_REQUIRE: '1'
        run: npm run test:hwpx-browser
