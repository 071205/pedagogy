name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Worker quota tests
        run: npm run test:worker
      - name: Commercial static checks
        run: npm run check:static
      - name: Firebase rules emulator parse
        run: npm run check:rules
      - name: Python server syntax
        run: python3 -c 'from pathlib import Path; compile(Path("serve.py").read_text(encoding="utf-8"), "serve.py", "exec")'
      - name: Whitespace errors
        run: git diff --check HEAD~1 HEAD
