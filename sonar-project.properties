# =============================================================================
# SonarQube Cloud 프로젝트 설정
# 목적: 개발 도구·테스트 코드의 오탐을 제거하고, 실제 서비스 코드만 정확히 분석한다.
# =============================================================================

sonar.projectKey=071205_pedagogy
sonar.organization=071205

# ---------------------------------------------------------------------------
# 분석 대상: 실제 서비스에 배포되는 코드만
# ---------------------------------------------------------------------------
# 루트의 HTML·JS (프론트엔드 앱)
# worker/ (Cloudflare Worker 백엔드)
# serve.py (로컬 개발 서버 — 사용자가 직접 실행)
# firestore.rules, storage.rules (보안 규칙)
sonar.sources=.

# ---------------------------------------------------------------------------
# 테스트 코드: 보안 검사에서 제외, 테스트로 분류
# ---------------------------------------------------------------------------
# scripts/    — 빌드·검사·CI용 Node.js 스크립트 (로컬 CLI 도구)
# experiments/ — HWPX 내보내기 실험용 Python 스크립트
# tests/       — 통합·회귀 테스트 HTML
# reviews/     — 감사·검토 스크립트 (audit-*.mjs 등)
# worker/*.test.mjs — Worker 단위 테스트
sonar.tests=scripts,experiments,tests,reviews
sonar.test.inclusions=scripts/**,experiments/**,tests/**,reviews/**,worker/*.test.mjs,worker/*test*

# ---------------------------------------------------------------------------
# 분석에서 완전히 제외: 분석할 가치가 없는 파일들
# ---------------------------------------------------------------------------
# node_modules/ — 외부 의존성 (우리 코드가 아님)
# dist/         — 빌드 산출물 (원본에서 이미 분석됨)
# __pycache__/  — Python 캐시
# .git/         — Git 내부
# *.hwp, *.hwpx, *.pdf — 바이너리 문서 파일
# work/         — 작업용 임시 디렉토리
# .claude/      — Claude 에이전트 설정 (훅 스크립트)
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  __pycache__/**,\
  work/**,\
  .claude/**,\
  test-fixtures/**,\
  test-results/**,\
  **/*.hwp,\
  **/*.hwpx,\
  **/*.pdf

# ---------------------------------------------------------------------------
# 언어별 파일 인코딩
# ---------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# JavaScript/TypeScript 설정
# ---------------------------------------------------------------------------
# Node.js 환경임을 명시 (브라우저 전용 전역 변수 오탐 방지)
sonar.javascript.environments=browser,node
