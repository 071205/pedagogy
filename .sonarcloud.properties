# SonarQube Cloud Automatic Analysis reads this file from the repository root.
# Keep the scope explicit: only shipped/runtime code and security-relevant CI
# configuration belong to main code. The HWPX modules imported by serve.py are
# runtime code even though they live below experiments/. Other local tools,
# probes, fixtures, review scripts, and test pages stay outside both scopes so
# their intentional use of paths, child processes, dynamic code, and local
# servers cannot be reported as production vulnerabilities.

sonar.sources=\
  index.html,\
  mock-exam-editor.html,\
  document-editor.html,\
  legal.html,\
  service-config.js,\
  pedagogy-normalize.js,\
  pedagogy-render.js,\
  pedagogy-print.js,\
  pedagogy-ai-image.js,\
  mock-library-store.js,\
  hwpx-engine.js,\
  hwpx-document.js,\
  hwpx-exam.js,\
  hwpx-exam-template.js,\
  worker,\
  serve.py,\
  experiments/hwp-export/mock_to_hwpx.py,\
  experiments/hwp-export/document_to_hwpx.py,\
  experiments/hwp-export/document_schema.py,\
  experiments/hwp-export/pedagogy_hwpx.py,\
  experiments/hwp-export/tex_to_hwp.py,\
  experiments/hwp-export/template.py,\
  experiments/hwp-export/exam_profile.py,\
  experiments/hwp-export/exam_style.py,\
  experiments/hwp-export/make_math_probe.py,\
  firestore.rules,\
  storage.rules,\
  .github

# Worker tests share a directory with production Worker code. Sonar's test
# inclusion is also applied as a source exclusion, keeping the two scopes
# disjoint. Other repository tests and developer tools are intentionally not
# analyzed at all.
sonar.tests=worker
sonar.test.inclusions=worker/**/*.test.mjs

# CI uses Python 3.12 and supported local environments use 3.12/3.13.
sonar.python.version=3.12,3.13

sonar.sourceEncoding=UTF-8
