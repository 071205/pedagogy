<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEDAGOGY — 모의고사 편집기</title>

<!-- 본체(index.html)와 같은 기준의 CSP.
     이 편집기는 로컬 렌더 서버(serve.py)에 /health·/render 를 부르고 글꼴도
     거기서 받아오므로 connect-src·font-src 에 로컬 주소를 넣는다.
     img-src 에 data: 가 필요한 이유는 정본 미리보기를 base64 PNG 로 받기 때문이다. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  font-src 'self' data: https://cdn.jsdelivr.net http://127.0.0.1:* http://localhost:*;
  img-src 'self' data: blob:;
  connect-src 'self' http://127.0.0.1:* http://localhost:*;
  object-src 'none';
  base-uri 'none';
  form-action 'none'">

<!-- CDN 무결성(SRI) — 버전을 올릴 때 해시도 반드시 함께 다시 계산할 것 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
        crossorigin="anonymous"></script>

<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

/* 평가원 실제 폰트 */
@font-face{font-family:'Hamchorom';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2104@1.0/HANBatang.woff') format('woff')}
@font-face{font-family:'Hamchorom';font-weight:700;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2104@1.0/HANBatangB.woff') format('woff')}

/* 시스템에 설치돼 있으면 정본과 같은 글꼴로 미리보기 —
   A053SinMyungjo95.ttf / A053SinMyungjo.ttf / 신그래픽체 / UnDinaru 를
   Font Book 에 설치해 두면 미리보기 줄바꿈까지 정본과 거의 같아진다.
   설치 안 돼 있으면 아래 웹폰트(함초롬)로 자동으로 떨어진다. */
@font-face{font-family:'ExamBody';font-weight:400;font-display:swap;
  src:local('A053 SinMyungjo 95'),local('A053SinMyungjo95'),
      local('A053 SinMyungjo'),local('A053SinMyungjo')}
@font-face{font-family:'ExamGraphic';font-weight:400;font-display:swap;
  src:local('신그래픽체'),local('SinGraphic'),local('HYgtrE')}
@font-face{font-family:'ExamRound';font-weight:400;font-display:swap;
  src:local('UnDinaru'),local('은 디나루')}
@font-face{font-family:'ExamHead';font-weight:400;font-display:swap;
  src:local('HYmjrE'),local('한양견명조')}
@font-face{font-family:'HamchoromD';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.0/HCRDotum.woff') format('woff')}

:root{
  --bg:#09090B; --surface-1:#111116; --surface-2:#18181F;
  --surface-3:#1F1F28; --surface-hover:#23232D;
  --border:#27272F; --border-subtle:#1F1F28;
  --text-primary:#F4F4F6; --text-secondary:#8B8B9A; --text-tertiary:#55555F;
  --blue:#3182F6; --blue-dim:#1A3566; --blue-subtle:#1B2540; --blue-hover:#4D96FF;
  --danger:#F04452;
  --ui-sans:'Pretendard Variable',Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;
  /* ── 시험지 글꼴 ──
     원본: 한글=신명 중명조 / 영문=한양신명조 (상용, 웹 배포 불가)
     미리보기는 함초롬바탕으로 대체하되 크기·장평·자간·줄간격은 원본 값 사용.
     Typst 내보내기에는 원본 글꼴명이 그대로 들어감. */
  /* 언어별 글꼴 분리 — 한글=신명 중명조, 영문/숫자=한양신명조 */
  --exam:'ExamBody','Hamchorom','KoPub Batang',serif;          /* 발문 — A053 신명조 95% */
  --exam-g:'ExamGraphic','HamchoromD','Hamchorom',sans-serif;  /* 수학 영역 — 신그래픽체 */
  --exam-h:'ExamHead','Hamchorom',serif;                       /* 제2교시·쪽번호 — 한양견명조 */
  --exam-d:'ExamRound','ExamGraphic','HamchoromD',sans-serif;  /* 회차명 — 은 디나루 */
  --radius-sm:8px; --radius-md:12px;

  /* ── PDF 실측 규격 (mm) ── */
  --pg-w:272; --pg-h:394.1;
  --mg:18.33;             /* 좌우 여백 */
  --body-w:235.42;        /* 본문 폭 */
  --col-w:112.57;         /* 단 폭 */
  --col-gap:10.28;        /* 단 간격 */
  --rule1:59.48;          /* 1p 괘선 y */
  --ruleN:35.01;          /* 2p+ 괘선 y */
  --body-bot:34.69;       /* 아래에서 본문 끝(y=359.41)까지 */
  /* ── HWP 스타일 정의값 (200906 수학.hwpx) ── */
  --fs:10.91pt;           /* 발문 — 프레임 10.91pt × K-BODY 1.0 */
  --fs-no:12.83pt;        /* 문항 번호 — 12.83pt × K-NO(대체폰트 보정 1.049 적용 전) */
  --fs-pts:10.91pt;       /* 배점 */
  --lh:1.65;              /* 줄간격 165% */
  --track:-.05em;         /* 자간 -5% (문제 계열) */
  --track-ch:-.03em;      /* 자간 -3% (선지 계열) */
  /* 장평: Typst에 글자 가로압축 기능이 없어 정본이 100%로 나간다.
     미리보기가 정본과 어긋나지 않도록 여기도 100%로 맞춘다.
     (평가원 원본은 발문 장평 95% — 현재 구현 한계) */
  --xscale:1;
  --eq:1.012;             /* 수식 배율 — 11.04pt / 10.91pt */
  --ind:3.99;             /* 내어쓰기 -3.99mm */
  --ch-gap:21.6;          /* 선지 간격 (09 정본 탭: 3.99·25.6·47.2·68.81·90.4) */
}

/* ══════════ 테마 ══════════
   위 :root 가 어두운 색이 기본이다. 아래에서 밝은 색을 덮어쓴다.
     · data-theme 없음  → 시스템 설정을 따른다
     · data-theme="light" / "dark" → 사용자가 고른 값이 항상 이긴다
   시험지(.paper)는 실제 인쇄물을 나타내므로 테마와 무관하게 항상 흰 종이다. */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5F6F8; --surface-1:#FFFFFF; --surface-2:#F0F1F4;
    --surface-3:#E7E9EE; --surface-hover:#E1E4EA;
    --border:#D6D9E0; --border-subtle:#E7E9EE;
    --text-primary:#16171A; --text-secondary:#5A5F6B; --text-tertiary:#8A909C;
    --blue-dim:#B9D3FA; --blue-subtle:#E8F1FE;
  }
}
:root[data-theme="light"]{
  --bg:#F5F6F8; --surface-1:#FFFFFF; --surface-2:#F0F1F4;
  --surface-3:#E7E9EE; --surface-hover:#E1E4EA;
  --border:#D6D9E0; --border-subtle:#E7E9EE;
  --text-primary:#16171A; --text-secondary:#5A5F6B; --text-tertiary:#8A909C;
  --blue-dim:#B9D3FA; --blue-subtle:#E8F1FE;
}
/* 밝은 테마에서는 미리보기 바탕을 살짝 눌러 흰 시험지가 도드라지게 한다 */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .preview{background:#E9EBEF}
}
:root[data-theme="light"] .preview{background:#E9EBEF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text-primary);font-family:var(--ui-sans);
  font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--surface-hover);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:0 16px;height:60px;background:var(--bg);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:100;
  gap:12px;overflow:hidden}
/* 좁아지면 왼쪽(제목 입력)이 먼저 줄고, 오른쪽 버튼들은 가로 스크롤된다 */
.tb-l{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
.tb-l .inp{min-width:0}
.tb-r{display:flex;align-items:center;gap:8px;flex:0 0 auto;
  overflow-x:auto;scrollbar-width:none}
.tb-r::-webkit-scrollbar{display:none}
.tb-r>*{flex:0 0 auto}
.brand{font-family:'Adobe Caslon Pro Bold',serif;font-size:22px;letter-spacing:.5px;
  font-weight:700;user-select:none}
.brand-tag{font-size:11px;color:var(--text-tertiary);letter-spacing:.08em;
  padding-left:12px;border-left:1px solid var(--border)}
.inp,.sel{background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:0 12px;height:36px;font-size:13px}
.inp{width:250px}
.inp:focus,.sel:focus{border-color:var(--blue);outline:none}
.btn{height:34px;padding:0 13px;background:transparent;border:1px solid transparent;
  border-radius:9px;font-size:13px;color:var(--text-secondary);
  display:inline-flex;align-items:center;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border);color:var(--text-primary)}
.btn.on{background:var(--blue-subtle);border-color:var(--blue-dim);color:var(--blue-hover)}
.btn-primary{height:34px;background:var(--blue);border-color:transparent;color:#fff;font-weight:600}
.btn-primary:hover{background:var(--blue-hover)}
.zoom{display:flex;align-items:center;background:var(--surface-2);
  border:1px solid var(--border);border-radius:9px;height:34px;overflow:hidden}
.zoom button{padding:0 11px;height:100%;color:var(--text-secondary);font-size:15px}
.zoom button:hover{background:var(--surface-hover);color:var(--text-primary)}
/* 배율 숫자를 누르면 100% 로 돌아간다 */
.zoom #zVal{font-size:12px;min-width:52px;text-align:center;color:var(--text-secondary);
  height:100%;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;border-left:1px solid var(--border);
  border-right:1px solid var(--border);cursor:pointer;font-variant-numeric:tabular-nums}
.zoom #zVal:hover{background:var(--surface-hover);color:var(--text-primary)}

/* PEDAGOGY 본체 안(iframe)에서는 위쪽 상단바에 이미 로고가 있으므로 중복을 없앤다 */
body.embedded .brand{display:none}
body.embedded .brand-tag{margin-left:0}


.panes{display:flex;height:calc(100% - 60px)}
/* 미리보기 칸 = 고정 머리(범위 토글) + 스크롤 본문 */
.preview-pane{flex:1 1 auto;min-width:320px;display:flex;flex-direction:column;
  overflow:hidden;position:relative}
.preview{flex:1 1 auto;min-height:0;overflow:auto;padding:24px;
  overscroll-behavior:contain;scrollbar-width:thin}
/* 확대는 .stage 에 transform 을 걸고, 이 래퍼가 '확대된 크기'를 그대로 차지해
   스크롤 범위가 자동으로 맞는다(예전의 음수 마진 보정 방식은 어긋나기 쉬웠다). */
.stage-wrap{position:relative;margin:0 auto}
.editor{flex:0 0 430px;background:var(--surface-1);border-left:1px solid var(--border);overflow-y:auto}
.outline{flex:0 0 176px;background:var(--surface-1);border-left:1px solid var(--border);overflow-y:auto}
.pane-hd{position:sticky;top:0;z-index:5;background:var(--surface-1);
  border-bottom:1px solid var(--border-subtle);padding:14px 18px;
  font-size:12px;color:var(--text-secondary);font-weight:600}

/* ── 시험지: 좌상단 기준 확대 ── */
.errbox{position:fixed;left:24px;bottom:24px;max-width:min(720px,60vw);z-index:60;
  background:#2A1416;border:1px solid #5A2026;border-radius:var(--radius-md);
  padding:12px 14px;color:#FFB4B4;font-size:12px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.errbox b{display:block;margin-bottom:6px;color:#F04452}
/* 오류가 아니라 안내일 때 — 빨강 대신 중립 톤 */
.errbox.info{background:var(--surface-2);border-color:var(--border);color:var(--text-secondary)}
.errbox.info b{color:var(--blue-hover,#4D96FF)}
.errbox .errclose{position:absolute;top:8px;right:10px;background:none;border:0;
  color:inherit;opacity:.55;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.errbox .errclose:hover{opacity:1}

/* 미리보기 범위 토글 */
/* 미리보기 범위 토글 — 스크롤과 무관하게 칸 맨 위에 고정 */
.pv-mode{flex:0 0 auto;display:flex;gap:6px;padding:12px 16px 10px;
  background:var(--bg);border-bottom:1px solid var(--border-subtle)}
.pv-mode button{flex:1;height:40px;font-size:13.5px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;color:var(--text-secondary);transition:.14s}
.pv-mode button:hover{background:var(--surface-hover);color:var(--text-primary)}
.pv-mode button.on{background:var(--blue);border-color:transparent;color:#fff}
/* 전체보기는 편집할 때마다 다시 그리지 않는다 — 갱신이 필요하면 표시 */
.pv-mode.stale button[data-v="all"]:not(.on){border-color:var(--blue-dim);color:var(--blue-hover)}
.pv-mode.stale button[data-v="all"]::after{content:" ●";font-size:8px;vertical-align:2px}
/* 편집 패널 맨 아래 추가 버튼 줄 */
.addbar{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.addbar .btn{height:30px;padding:0 10px;font-size:12px}

/* ── 블록 조립 편집 (N제 편집기와 동일한 UI) ── */
.blocks{display:flex;flex-direction:column}
.block{border:1px solid var(--border);border-radius:11px;background:var(--surface-1);
  overflow:hidden;transition:border-color .14s}
.block:hover{border-color:var(--border-hover,#35353F)}
.blk-inactive{opacity:.55}
.blk-note{font-size:11px;color:var(--muted,#888);margin-left:auto;padding-left:8px;white-space:nowrap}
.blk-head{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 6px;
  background:var(--surface-2);border-bottom:1px solid var(--border-subtle)}
.blk-handle{cursor:grab;color:var(--text-tertiary);width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;user-select:none;opacity:.7}
.blk-handle svg{width:16px;height:16px}
.blk-handle:hover{opacity:1;color:var(--text-secondary)}
.blk-handle:active{cursor:grabbing}
.blk-type-sel{flex:1;height:26px;padding:0 6px;font-size:12px;font-weight:700;
  background:transparent;border:1px solid transparent;border-radius:6px;
  color:var(--text-secondary);cursor:pointer}
.blk-type-sel:hover{background:var(--surface-3);border-color:var(--border);color:var(--text-primary)}
.blk-ico{width:26px;height:26px;padding:0;border:0;background:transparent;
  color:var(--text-tertiary);border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.blk-ico svg{width:15px;height:15px;display:block}
.blk-ico:hover{background:var(--surface-3);color:var(--text-primary)}
.blk-ico:last-child:hover{color:var(--danger)}
.blk-body{padding:10px;display:flex;flex-direction:column;gap:6px}
.blk-body .hint{margin-top:2px}

/* 블록 사이 삽입 지점 */
.blk-insert{position:relative;height:14px;display:flex;align-items:center;justify-content:center}
.blk-insert-line{position:absolute;left:0;right:0;height:1px;background:transparent;transition:.12s}
.blk-insert-btn{position:relative;width:20px;height:20px;padding:0;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-tertiary);
  font-size:13px;line-height:1;opacity:0;transition:.12s;cursor:pointer}
.blk-insert:hover .blk-insert-line{background:var(--blue-dim)}
.blk-insert:hover .blk-insert-btn,.blk-insert.open .blk-insert-btn{opacity:1}
.blk-insert.open .blk-insert-btn{background:var(--blue);border-color:transparent;color:#fff;transform:rotate(45deg)}
.blk-insert-menu{display:none;position:absolute;top:24px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:5px;
  z-index:30;box-shadow:0 8px 28px rgba(0,0,0,.35);grid-template-columns:1fr 1fr;gap:3px;width:220px}
.blk-insert.open .blk-insert-menu{display:grid}
.blk-insert-menu button{height:28px;padding:0 8px;font-size:12px;text-align:left;
  background:transparent;border:0;color:var(--text-secondary);border-radius:6px;cursor:pointer}
.blk-insert-menu button:hover{background:var(--blue-subtle);color:var(--blue-hover)}

/* 미리보기의 ㄱㄴㄷ 보기 상자 */
.exbox .exmk{font-weight:700;margin-right:.35em}

/* ── 토스트 알림 (본체 PEDAGOGY 와 동일한 UX) ── */
#toastHost{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:3000;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface-3);color:var(--text-primary);
  border:1px solid var(--border);border-radius:12px;
  padding:11px 18px;font-size:13px;font-weight:500;
  font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px) scale(.97);
  transition:opacity .28s cubic-bezier(.16,1,.3,1), transform .28s cubic-bezier(.16,1,.3,1);
  max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast--success{border-color:#05C072}
.toast--success::before{content:"✓ ";color:#05C072;font-weight:700}
.toast--error{border-color:#F04452}
.toast--error::before{content:"⚠ ";color:#F04452;font-weight:700}
.errbox pre{white-space:pre-wrap;font:11px/1.5 ui-monospace,Menlo,monospace;max-height:30vh;overflow:auto}
.live-pg{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.6);flex:none;display:block}
.stage.busy{opacity:.55;transition:opacity .15s}
.stage{transform-origin:0 0;display:flex;flex-direction:column;gap:24px;width:max-content}
.paper{position:relative;width:calc(var(--pg-w)*1mm);height:calc(var(--pg-h)*1mm);
  background:#fff;color:#000;flex:none;box-shadow:0 4px 24px rgba(0,0,0,.6);
  font-family:var(--exam);overflow:hidden}

.prob{font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--track);

/* 조건 박스 — 보기틀 스타일: 11.48pt, 자간 -3%, 줄간격 150%, 좌여백 3.53mm */
.condbox{width:104mm;/* 09 정본 108.07mm */border:.12mm solid #000;padding:3mm;

/* 선지 — 21.72mm 고정 탭 */

/* 꼬리말 */

/* 빗금은 왼쪽아래 → 오른쪽위 방향(/). 정본(Typst pfoot)의
   line(start:(0,7.75mm), end:(17.7mm,0)) 과 같은 방향이어야 한다.

<main class="panes">

<div id="measure" style="position:absolute;visibility:hidden;left:-9999px;
  font-family:'Hamchorom',serif;font-size:11.04pt;white-space:nowrap"></div>

<script>
const SPEC={colW:112.57,chGap:21.72,r1:0.62,r2:1.00,perCol:2};
const MM=96/25.4;
const PTS={1:2,2:2,3:3,4:3,5:3,6:3,7:3,8:3,9:4,10:4,11:4,12:4,13:4,14:4,15:4,
           16:3,17:3,18:3,19:3,20:4,21:4,22:4,
           23:2,24:3,25:3,26:3,27:3,28:4,29:4,30:4};
const MARKS=['①','②','③','④','⑤'];

function blank(n){/* figSrc: 그림 파일명 */
  const sect=n<=22?'공통':'선택';
  const type=(n<=15||(n>=23&&n<=28))?'choice':'short';
  return {id:'p'+n,num:n,sect,type,pts:PTS[n],
    blocks:[{type:'statement',data:{text:''}}]
      .concat(type==='choice'?[{type:'choices',data:{items:['','','','',''],layout:'auto'}}]:[]),
    layout:'auto',breakAfter:false};
}
const state={problems:Array.from({length:30},(_,i)=>blank(i+1)),sel:'p1',zoom:.6,guides:false,
  pvMode:'one'};   // 'one' = 지금 문항만(실시간) · 'all' = 시험지 전체(누를 때만)

(function seed(){
  const P=state.problems;
  P[0].stmt='$\\sqrt[3]{5}\\times 25^{\\frac13}$의 값은?';
  P[0].choices=['$1$','$2$','$3$','$4$','$5$'];
  P[1].stmt='함수 $f(x)=x^3-8x+7$에 대하여 $\\lim\\limits_{h\\to0}\\dfrac{f(2+h)-f(2)}{h}$의 값은?';
  P[1].choices=['$1$','$2$','$3$','$4$','$5$'];
  P[2].stmt='첫째항과 공비가 모두 양수 $k$인 등비수열 $\\{a_n\\}$이\n$\\dfrac{a_4}{a_2}+\\dfrac{a_2}{a_1}=30$\n을 만족시킬 때, $k$의 값은?';
  P[2].choices=['$1$','$2$','$3$','$4$','$5$'];
  P[8].stmt='함수 $f(x)=3x^2-16x-20$에 대하여 $\\displaystyle\\int_{-2}^{a}f(x)\\,dx=\\int_{-2}^{0}f(x)\\,dx$일 때, 양수 $a$의 값은?';
  P[8].choices=['$16$','$14$','$12$','$10$','$8$'];
  P[13].stmt='그림과 같이 삼각형 $ABC$에서 선분 $AB$ 위에 $\\overline{AD}:\\overline{DB}=3:2$인 점 $D$를 잡고, 점 $A$를 중심으로 하고 점 $D$를 지나는 원을 $O$라 하자.\n원 $O$ 위의 점 $P$에 대하여 삼각형 $PBC$의 넓이의 최댓값은? (단, $\\overline{AB}<\\overline{AC}$)\n[그림]';
  P[13].figure=58;
  P[13].choices=['$18+15\\sqrt3$','$24+20\\sqrt3$','$30+25\\sqrt3$','$36+30\\sqrt3$','$42+35\\sqrt3$'];
  P[14].stmt='상수 $a\\;(a\\neq3\\sqrt5)$와 최고차항의 계수가 음수인 이차함수 $f(x)$에 대하여 함수 $g(x)$가 다음 조건을 만족시킨다.\n[조건]\n$g(-2)+g(2)$의 값은?';
  P[14].useCond=true;
  P[14].conds=['(가) 함수 $g(x)$는 실수 전체의 집합에서 미분가능하다.',
               '(나) $x$에 대한 방정식 $g\'(x)\\times g\'(x-4)=0$의 서로 다른 실근의 개수는 $4$이다.'];
  P[14].choices=['$30$','$32$','$34$','$36$','$38$'];
})();

const $=s=>document.querySelector(s);
/* 따옴표까지 막는다. 지금은 사용자 값이 HTML '속성' 자리에 들어가는 곳이 없어
   & < > 만으로도 충분하지만, 나중에 style="…" 이나 title="…" 안에 값을 넣는
   코드가 생기면 그때는 이미 늦는다. 본체 index.html 의 sanitize() 와 정책을 맞춘다. */
const esc=s=>String(s).replace(/[&<>"']/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tex(src){
  if(!src) return '';
  return String(src).split(/(\$[^$]*\$)/g).map(p=>{
    if(p.length>2&&p.startsWith('$')&&p.endsWith('$')){
      /* 정본(Typst) 경로와 같은 cases 간격 보정을 적용해야 미리보기와 결과물이 어긋나지 않는다.
         fixCases 는 함수 선언이라 이 시점에도 호이스팅되어 있다. */
      try{return katex.renderToString(fixCases(p.slice(1,-1)),{throwOnError:false,output:'html'});}
      catch(e){return '<span style="color:#F04452">'+esc(p)+'</span>';}
    }
    return esc(p);
  }).join('');
}
/* 09 정본 탭 칸에 선지가 실제로 들어가는지로 판정한다.
   ①-5 칸폭 21.6mm(마지막 칸은 남는 폭 전부) · ①-3 칸폭 36.0mm
   비율만 보면 √3 붙은 선지처럼 총폭이 넘쳐도 3+2로 들어가는 경우를 놓친다. */
function measureCh(ch){
  const m=$('#measure');const w=[];let t=0;
  ch.forEach((c,i)=>{m.innerHTML=MARKS[i]+' '+(tex(c)||'0');
    const x=m.offsetWidth/MM; w.push(x); t+=x;});
  const last=w.length-1;
  const fits1=w.every((x,i)=>i===last?x<=SPEC.colW-90.4:x<=21.6-1.0);
  const fits2=w.every((x,i)=>(i===2||i===last)?x<=SPEC.colW-76-1:x<=36.0-1.0);
  return {ratio:t/SPEC.colW, widths:w, fits1, fits2};
}
/* ㄱㄴㄷ 보기 라벨 */
const HGND=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ'];

/* 선지는 이제 choices 블록에 들어 있다. 없으면 빈 배열. */
function choiceItems(p){
  const b=choicesBlock(p);
  const a=b?(b.data.items||[]).map(x=>String(x||'')):[];
  while(a.length<5) a.push('');
  return a.slice(0,5);
}
function layoutOf(p){
  const b=choicesBlock(p);
  const lay=(b&&b.data.layout)||p.layout||'auto';
  if(lay!=='auto') return lay;
  const ch=choiceItems(p);
  if(hasGND(ch)) return '2';                  // ㄱㄴㄷ 합답형은 폭과 무관하게 3+2
  const {fits1,fits2}=measureCh(ch);
  return fits1?'1':fits2?'2':'v';
}
/* ㄱ/ㄴ/ㄷ 합답형 — 평가원 관례상 항상 3+2 */
function hasGND(ch){return ch.some(c=>/[ㄱㄴㄷ]/.test(c));}
function renderChoices(p,u){
  const items=(u&&u.items)||choiceItems(p);
  if(!items.some(c=>c.trim())) return '';
  const it=items.map((c,i)=>`<span class="it">${MARKS[i]} ${tex(c)}</span>`);
  const L=layoutOf(p);
  if(L==='1') return `<div class="ch ch-1"><div class="r">${it.join('')}</div></div>`;
  if(L==='2') return `<div class="ch ch-2"><div class="r">${it.slice(0,3).join('')}</div><div class="r">${it.slice(3).join('')}</div></div>`;
  return `<div class="ch ch-v">${it.map(x=>`<div class="r">${x}</div>`).join('')}</div>`;
}
/* ── 평가원 조판 관례 ──
   · 수식 앞 공백 1칸 (원본 236회 중 압도적) / 수식 뒤엔 조사 바로 붙임
   · 수식만 있는 줄 → 별행(디스플레이) 수식, 가운데 정렬
   · (단, ~) 은 별도 줄로 내림                                        */
const JOSA=/^[의이가은는을를에와과로도만나며서라人]/;
/* 지문 안에서 조건 박스·그림이 놓일 자리를 [조건] / [그림] 한 줄로 지정한다.
   마커가 없으면 지금까지처럼 지문 뒤·선지 앞에 붙는다. */
const MK_C=/^\[조건\]$/, MK_F=/^\[그림\]$/;

/* ══════════════════════════════════════════════════════════════
   블록 모델 — N제 편집기(PEDAGOGY 본체)와 입력 방식을 통일하기 위한 공용 구조

   예전에는 지문을 큰 textarea 하나에 넣고, 줄 모양과 [조건]·[그림] 마커로
   구조를 '암시'했다. 오타 하나로 조건 박스가 본문이 되고, 순서를 바꾸려면
   텍스트를 잘라 옮겨야 했으며, ㄱㄴㄷ 보기·박스형 해설은 아예 표현할 수 없었다.
   이제 구조를 blocks[] 로 명시한다. 예전 파일은 legacyToBlocks() 가 변환한다.
   ══════════════════════════════════════════════════════════════ */
const BLK_LABELS={statement:"문제 본문",conditions:"가나다 조건",examples:"ㄱㄴㄷ 보기",
                  boxed:"박스형 해설",choices:"답 선지",image:"그림"};

function blankBlockData(type){
  if(type==='statement'||type==='boxed') return {text:''};
  if(type==='conditions'||type==='examples') return {items:['']};
  if(type==='choices') return {items:['','','','',''],layout:'auto'};
  if(type==='image') return {width:58,src:''};
  return {};
}

/* 예전 형식(stmt/conds/choices/figure) → blocks[] */
function legacyToBlocks(p){
  const out=[];
  const lines=String(p.stmt||'').replace(/\s*(\(단,)/g,'\n$1')
                .split('\n').map(x=>x.trim()).filter(Boolean);
  const condBlk=()=> (p.useCond && (p.conds||[]).length)
      ? {type:'conditions',data:{items:p.conds.slice(0,6)}} : null;
  const figBlk=()=> (+p.figure)
      ? {type:'image',data:{width:+p.figure,src:String(p.figSrc||'')}} : null;
  let usedC=false, usedF=false, buf=[];
  const flush=()=>{ if(buf.length){ out.push({type:'statement',data:{text:buf.join('\n')}}); buf=[]; } };
  lines.forEach(t=>{
    if(MK_C.test(t)){ flush(); const c=condBlk(); if(c){out.push(c);usedC=true;} return; }
    if(MK_F.test(t)){ flush(); const f=figBlk(); if(f){out.push(f);usedF=true;} return; }
    buf.push(t);
  });
  flush();
  if(!usedC){ const c=condBlk(); if(c) out.push(c); }
  if(!usedF){ const f=figBlk(); if(f) out.push(f); }
  if(p.type==='choice' && (p.choices||[]).some(c=>String(c).trim()))
    out.push({type:'choices',data:{items:p.choices.slice(0,5),layout:p.layout||'auto'}});
  return out.length?out:[{type:'statement',data:{text:''}}];
}

/* 이 문항의 블록 배열. 예전 형식만 있으면 한 번 변환해 심어 둔다. */
function blocksOf(p){
  if(!Array.isArray(p.blocks)||!p.blocks.length){ p.blocks=legacyToBlocks(p); return p.blocks; }
  // 블록이 있어도 내용이 전부 비어 있고 예전 필드에 내용이 있으면 그쪽을 살린다
  // (blank() 가 만든 빈 블록 위에 예전 형식 데이터가 얹힌 경우)
  const empty=p.blocks.every(b=>{
    const d=b.data||{};
    return !String(d.text||'').trim()
        && !(d.items||[]).some(x=>String(x||'').trim())
        && !(+d.width);
  });
  const legacy=String(p.stmt||'').trim() || (p.conds||[]).some(x=>String(x).trim())
            || (p.choices||[]).some(x=>String(x).trim()) || (+p.figure);
  if(empty&&legacy) p.blocks=legacyToBlocks(p);
  return p.blocks;
}
/* 문항 번호가 바뀌면 5지선다↔단답이 달라진다. 그에 맞게 '선지 블록' 을 넣거나 뺀다.
   예전에는 쓰지 않게 된 p.choices 필드만 건드려서, 단답형에 선지가 남거나
   선택형인데 선지가 사라지는 일이 있었다. */
/* 문항 종류(객관식/단답형)에 맞춰 선지 블록의 '존재'를 맞춘다.
   ⚠️ 단답형이 됐다고 선지 블록을 splice 로 지우면 안 된다.
   예전에는 지웠는데, 왼쪽 순서도에서 문항을 끌다가 단답형 자리(예: 22번)에
   잠깐 스치기만 해도 그 순간 선지 5개가 통째로 사라졌다. 1초 만에 제자리로
   돌려놔도 이미 지워진 뒤라 복구할 방법이 없었다.
   지금은 블록을 남겨 두고 '시험지에 안 나오게' 만 한다 — 렌더러(probUnits)가
   단답형일 때 선지 유닛을 건너뛴다. 다시 객관식으로 돌아오면 그대로 살아난다. */
function syncChoicesBlock(p){
  const bs=blocksOf(p);
  const i=bs.findIndex(b=>b.type==='choices');
  if(p.type!=='short' && i<0) bs.push({type:'choices',data:blankBlockData('choices')});
  // 단답형일 때는 아무것도 지우지 않는다(내용 보존)
}

function choicesBlock(p){ return blocksOf(p).find(b=>b.type==='choices')||null; }

/* ── 렌더 공용 유닛 ──
   화면 근사 미리보기와 Typst 정본이 각자 줄을 분류하던 것을 하나로 모은다.
   두 경로가 어긋나던 원인을 없애기 위한 것이므로, 렌더러는 반드시 이걸 쓴다.
   ptsAt : [N점] 표시를 붙일 유닛 번호(마지막 본문 줄) */
function probUnits(p){
  const units=[];
  blocksOf(p).forEach(b=>{
    const d=b.data||{};
    if(b.type==='statement'){
      String(d.text||'').replace(/\s*(\(단,)/g,'\n$1').split('\n')
        .map(x=>x.trim()).filter(Boolean)
        .forEach(t=>units.push(/^\$[^$]*\$$/.test(t)?{k:'eq',t}:{k:'text',t}));
    }
    else if(b.type==='boxed'){
      const t=String(d.text||'').trim(); if(t) units.push({k:'boxed',t});
    }
    else if(b.type==='conditions'||b.type==='examples'){
      const items=(d.items||[]).map(x=>String(x)).filter(x=>x.trim());
      if(items.length) units.push({k:b.type==='conditions'?'cond':'ex',items});
    }
    else if(b.type==='choices'){
      // 단답형 문항이면 선지 블록이 남아 있어도 시험지에는 싣지 않는다.
      // (블록을 지우지 않고 숨기기만 하므로 다시 객관식이 되면 그대로 나온다)
      if(p.type==='short') return;
      const items=(d.items||[]).map(x=>String(x||''));
      if(items.some(x=>x.trim())) units.push({k:'choices',items,layout:d.layout||'auto'});
    }
    else if(b.type==='image'){
      const w=+d.width||0; if(w) units.push({k:'fig',w,src:String(d.src||'')});
    }
  });
  let ptsAt=-1;
  units.forEach((u,i)=>{ if(u.k==='text') ptsAt=i; });
  if(ptsAt<0) units.forEach((u,i)=>{ if(u.k!=='choices'&&ptsAt<0) ptsAt=i; });
  return {units, ptsAt};
}
function probIsEmpty(p){ return !probUnits(p).units.some(u=>u.k!=='choices'); }

/* stmtLines() 는 probUnits() 안으로 흡수됐다(블록 전환). */

function renderProb(p){
  const {units,ptsAt}=probUnits(p);
  if(probIsEmpty(p))
    return `<div class="prob"><div class="stmt"><span class="no">${p.num}.</span><span class="empty">—</span></div></div>`;
  let h=`<div class="prob">`, first=true;
  units.forEach((u,i)=>{
    const pts=i===ptsAt?`<span class="pts">[${p.pts}점]</span>`:'';
    if(u.k==='text'){
      if(first){ h+=`<div class="stmt"><span class="no">${p.num}.</span>${tex(u.t)}${pts}</div>`; first=false; }
      else h+=`<div class="cont">${tex(u.t)}${pts}</div>`;
    }
    else if(u.k==='eq')   h+=`<div class="dispeq">${tex(u.t)}${pts}</div>`;
    else if(u.k==='cond') h+=`<div class="condbox">${u.items.map(c=>`<div>${tex(c)}</div>`).join('')}</div>`;
    else if(u.k==='ex')   h+=`<div class="condbox exbox">${u.items.map((c,j)=>
      `<div><span class="exmk">${HGND[j%HGND.length]}.</span> ${tex(c)}</div>`).join('')}</div>`;
    else if(u.k==='boxed')h+=`<div class="condbox">${tex(u.t)}</div>`;
    else if(u.k==='fig')  h+=`<div class="figbox" style="width:${Math.min(u.w,110)}mm;height:${Math.round(u.w*.68)}mm">${u.src?esc(u.src):'그림'}</div>`;
    else if(u.k==='choices') h+=renderChoices(p,u);
  });
  return h+`</div>`;
}

/* ══════════ 쪽 구성 ══════════
   · 한 단 SPEC.perCol문항 · breakAfter로 강제 단 나눔
   · 공통 → 선택 경계에서는 반드시 새 쪽의 왼쪽 단부터 시작
   미리보기와 Typst 내보내기가 이 함수를 함께 쓰므로 배치가 어긋나지 않는다. */
function buildPages(){
  const P=state.problems,cols=[];let cur=[];
  P.forEach((p,i)=>{
    cur.push(p);
    const nx=P[i+1];
    if(cur.length>=SPEC.perCol||p.breakAfter||(nx&&nx.sect!==p.sect)){cols.push(cur);cur=[];}
  });
  if(cur.length)cols.push(cur);
  const pages=[];let pg=[];
  cols.forEach(col=>{
    if(pg.length===1&&pg[0].length&&col[0].sect!==pg[0][0].sect){pg.push([]);pages.push(pg);pg=[];}
    pg.push(col);
    if(pg.length===2){pages.push(pg);pg=[];}
  });
  if(pg.length){pg.push([]);pages.push(pg);}
  return pages;
}
/* 각 (과목구분 × 문항유형)의 첫 문항인가 */
function isGroupFirst(p){
  const f=state.problems.find(x=>x.sect===p.sect&&x.type===p.type);
  return !!f&&f.id===p.id;
}
/* 구획 태그 — 단 첫머리면 절대배치, 아니면 문항 위에 흐름대로 */
function tagOf(col){
  if(!col||!col.length)return null;
  const p=col[0];
  return isGroupFirst(p)?tagName(p):null;
}
function tagName(p){return p.type==='choice'?'5지선다형':'단답형';}
/* 쪽 메타 — 선택과목이 시작되면 쪽번호가 1로 되돌아간다 (꼬리말은 통쪽수) */
function pageMeta(pages){
  let sect=null,local=0;
  return pages.map((pg,i)=>{
    const c=pg.find(x=>x&&x.length),s=c?c[0].sect:(sect||'공통');
    if(s!==sect){sect=s;local=1;}else local++;
    return {sect:s,pageno:local,sheetno:i+1,first:local===1};
  });
}
/* 확인 사항 — 각 과목의 마지막 쪽 오른쪽 단 아래 */
function noteFor(meta,i,elec){
  const M=meta[i],N=meta[i+1];
  if(N&&N.sect===M.sect)return null;
  const L=['※ 확인 사항','◦ 답안지의 해당란에 필요한 내용을 정확히 기입(표기)했는지 확인하시오.'];
  if(M.sect==='공통')L.push('◦ 이어서, 「선택과목('+elec+')」 문제가 제시되오니, 자신이 선택한 과목인지 확인하시오.');
  return L;
}

/* '이 문항' 모드의 근사 미리보기 — 시험지 한 단 폭으로 지금 문항만 그린다.
   실시간(Typst) 모드의 oneProbTypst() 와 같은 범위를 보여 주기 위한 것. */
function renderOneProbPreview(){
  const p=state.problems.find(x=>x.id===state.sel);
  const st=$('#stage');
  if(!p){ st.innerHTML=''; return; }
  st.innerHTML=`<div class="paper one-prob" style="width:${SPEC.colW+14}mm;min-height:auto;padding:7mm">`
    +`<div class="col">${renderProb(p)}</div></div>`;
  applyZoom();
  applyPendingFit();
}

function renderPreview(){
  if(LIVE.on){requestRender();return;}   // 실시간 모드면 서버 렌더로 넘긴다
  // '이 문항' 모드는 근사 미리보기에서도 지금 고른 문항만 보여준다.
  // (예전에는 실시간일 때만 반영돼서, 서버가 없으면 버튼이 먹통이었다)
  if(state.pvMode!=='all'){ renderOneProbPreview(); return; }
  const pages=buildPages(),meta=pageMeta(pages);
  const round=$('#round').value,elec=$('#elective').value;

  $('#stage').innerHTML=pages.map((pg,pi)=>{
    const M=meta[pi],n=M.pageno,odd=n%2===1;
    const area=M.sect==='선택'?`수학 영역(${elec})`:'수학 영역';
    const ruleY=M.first?59.48:35.01;
    const hd=M.first
      ? `<div class="round" style="top:24.5mm"><span>${esc(round)}</span></div>
         <div class="area" style="top:39mm"><span>${esc(area)}</span></div>
         <div class="gyosi" style="left:18.97mm;top:38.44mm;width:32mm;height:10.96mm"><span>제 2 교시</span></div>
         <div class="pno" style="right:18.33mm;top:21.8mm">${n}</div>`
      : `<div class="area p2" style="top:24mm"><span>${esc(area)}</span></div>
         <div class="pno" style="${odd?'right':'left'}:18.33mm;top:23.4mm">${n}</div>`;
    const note=noteFor(meta,pi,elec);
    return `<div class="paper ${state.guides?'g':''}">
      ${hd}
      <div class="rule" style="top:${ruleY}mm"></div>
      <div class="divider" style="top:${ruleY}mm"></div>
      <div class="body" style="top:${ruleY+4.5}mm">
        ${[0,1].map(ci=>{
          const col=pg[ci]||[],t=tagOf(col);
          const rows=Math.max(col.length,SPEC.perCol);
          return `<div class="col">${t?`<div class="tag ${t==='단답형'?'short':''}">${t}</div>`:''}
            <div class="slots" style="grid-template-rows:repeat(${rows},1fr)">
              ${col.map((p,i)=>`<div class="slot">${
                  i>0&&isGroupFirst(p)?`<div class="tag inline ${tagName(p)==='단답형'?'short':''}">${tagName(p)}</div>`:''
                }${renderProb(p)}</div>`).join('')}
            </div></div>`;
        }).join('')}
      </div>
      ${note?`<div class="notebox">${note.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}
      <div class="pbox"><span class="n">${M.sheetno}</span><span class="b">${pages.length}</span></div>
    </div>`;
  }).join('');
  applyZoom();
}

/* ══════════ 문항 편집 — 블록 조립 ══════════
   N제 편집기(PEDAGOGY 본체)와 같은 방식으로 통일했다.
   배점·공통/선택·선지배치·단나눔 같은 '시험지 고유' 설정은 그대로 둔다. */
/* 선 아이콘 — 텍스트 기호(⧉ ✕ ⠿)는 글꼴마다 모양·크기가 제각각이라 SVG 로 통일 */
const ICON={
  grip:'<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="4" r="1.1"/><circle cx="10" cy="4" r="1.1"/><circle cx="6" cy="8" r="1.1"/><circle cx="10" cy="8" r="1.1"/><circle cx="6" cy="12" r="1.1"/><circle cx="10" cy="12" r="1.1"/></svg>',
  copy:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="7.5" width="9" height="9" rx="2"/><path d="M4.5 12.5V5a2 2 0 0 1 2-2H14"/></svg>',
  trash:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12"/><path d="M8 6V4.5h4V6"/><path d="M5.6 6l.6 9.2A1.6 1.6 0 0 0 7.8 17h4.4a1.6 1.6 0 0 0 1.6-1.8L14.4 6"/></svg>',
};
const elx=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

function convertBlock(blk,to){
  const from=blk.type, d=blk.data||{}, nd=blankBlockData(to);
  const textLike=t=>t==='statement'||t==='boxed';
  const listLike=t=>t==='conditions'||t==='examples'||t==='choices';
  if(textLike(from)&&textLike(to)) nd.text=d.text||'';
  else if(listLike(from)&&listLike(to)){
    const src=(d.items||[]).filter(x=>x!=null);
    if(to==='choices'){ const a=src.slice(0,5); while(a.length<5)a.push(''); nd.items=a; }
    else nd.items=src.length?src:[''];
  }
  else if(textLike(from)&&listLike(to)){
    const lines=String(d.text||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(to==='choices'){ const a=lines.slice(0,5); while(a.length<5)a.push(''); nd.items=a; }
    else nd.items=lines.length?lines:[''];
  }
  else if(listLike(from)&&textLike(to)) nd.text=(d.items||[]).filter(Boolean).join('\n');
  else if(from==='image'&&to==='image') return d;
  return nd;
}

function edChanged(p,full){
  DIRTY=true; scheduleDraft();
  renderPreview(); renderOutline();
  if(full) renderEditor();
}

function renderEditor(){
  const p=state.problems.find(x=>x.id===state.sel);
  if(!p) return;
  const isCh=p.type==='choice';
  const host=$('#ed'); host.innerHTML='';
  const root=elx('div','ed');

  /* ── 문항 머리 (시험지 고유 설정) ── */
  const top=elx('div','ed-top');
  top.append(elx('div','ed-no',String(p.num)),
             elx('span','chip',p.sect),
             elx('span','chip',isCh?'5지선다':'단답형'));
  const sp=elx('div'); sp.style.flex='1'; top.append(sp);
  const pts=elx('select','sel');
  [2,3,4].forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v+'점';
    if(v===p.pts)o.selected=true; pts.append(o); });
  pts.onchange=e=>{ p.pts=parseInt(e.target.value)||p.pts; edChanged(p,false); };
  top.append(pts); root.append(top);

  /* ── 블록 조립 ── */
  const area=elx('div','blocks'); root.append(area);
  const blocks=blocksOf(p);

  const insertPoint=(at)=>{
    const row=elx('div','blk-insert');
    row.append(elx('div','blk-insert-line'));
    const plus=elx('button','blk-insert-btn','+'); plus.title='여기에 블록 추가';
    plus.onclick=e=>{ e.stopPropagation(); row.classList.toggle('open'); };
    const menu=elx('div','blk-insert-menu');
    Object.entries(BLK_LABELS).forEach(([v,label])=>{
      const b=elx('button',null,label);
      b.onclick=e=>{ e.stopPropagation();
        blocks.splice(at,0,{type:v,data:blankBlockData(v)}); edChanged(p,true); };
      menu.append(b);
    });
    row.append(plus,menu); return row;
  };
  area.onclick=e=>{ if(!e.target.closest('.blk-insert'))
    area.querySelectorAll('.blk-insert.open').forEach(x=>x.classList.remove('open')); };

  blocks.forEach((blk,idx)=>{
    area.append(insertPoint(idx));
    const wrap=elx('div','block'); wrap.dataset.bi=String(idx);
    const head=elx('div','blk-head');
    const handle=elx('div','blk-handle',ICON.grip); handle.title='끌어서 순서 변경';
    const sel=elx('select','blk-type-sel');
    Object.entries(BLK_LABELS).forEach(([v,label])=>{
      const o=document.createElement('option'); o.value=v; o.textContent=label;
      if(v===blk.type)o.selected=true; sel.append(o);
    });
    sel.title='블록 종류 바꾸기';
    sel.onchange=()=>{ const to=sel.value; if(to===blk.type)return;
      blk.data=convertBlock(blk,to); blk.type=to; edChanged(p,true); };
    head.append(handle,sel);

    const dup=elx('button','blk-ico',ICON.copy); dup.title='블록 복제';
    dup.onclick=()=>{ blocks.splice(idx+1,0,JSON.parse(JSON.stringify(blk))); edChanged(p,true); };
    const del=elx('button','blk-ico',ICON.trash); del.title='블록 삭제';
    del.onclick=()=>{ blocks.splice(idx,1);
      if(!blocks.length) blocks.push({type:'statement',data:{text:''}}); edChanged(p,true); };
    head.append(dup,del);
    /* 단답형 문항에 남아 있는 선지 블록 — 지우지 않고 보존하되, 시험지에는
       나오지 않는다는 걸 분명히 알려 준다. (순서도에서 잘못 끌어 놓아도
       내용이 사라지지 않게 하려고 남겨 두는 것이다) */
    if(blk.type==='choices' && p.type==='short'){
      wrap.classList.add('blk-inactive');
      head.append(elx('span','blk-note','단답형이라 시험지에는 안 나와요 · 내용은 그대로 보관됩니다'));
    }
    wrap.append(head);

    const body=elx('div','blk-body');

    if(blk.type==='statement'||blk.type==='boxed'){
      const ta=elx('textarea','ta'); ta.rows=blk.type==='boxed'?3:5;
      ta.placeholder=blk.type==='boxed'?'박스 안에 들어갈 내용':'수식은 $...$ 안에 LaTeX으로';
      ta.value=blk.data.text||'';
      body.append(ta);
      ta.addEventListener('input',e=>{ blk.data.text=e.target.value; edChanged(p,false); });
      if(blk.type==='statement')
        body.append(elx('div','hint','수식만 있는 줄은 별행 수식이 됩니다 · <code>(단, …)</code> 는 자동으로 줄을 내립니다'));
    }

    if(blk.type==='conditions'||blk.type==='examples'){
      const labels=blk.type==='conditions'?['(가)','(나)','(다)','(라)','(마)','(바)']:HGND.map(x=>x+'.');
      if(!blk.data.items||!blk.data.items.length) blk.data.items=[''];
      blk.data.items.forEach((t,i)=>{
        const row=elx('div','row-in');
        row.append(elx('div','mk',labels[i%labels.length]));
        const inp=elx('input','inp'); inp.type='text'; inp.value=t;
        const rm=elx('button','blk-ico',ICON.trash); rm.title='항목 삭제';
        rm.onclick=()=>{ blk.data.items.splice(i,1);
          if(!blk.data.items.length) blk.data.items=['']; edChanged(p,true); };
        row.append(inp,rm); body.append(row);
        inp.oninput=e=>{ blk.data.items[i]=e.target.value; edChanged(p,false); };
      });
      const add=elx('button','btn','+ 항목 추가');
      add.onclick=()=>{ blk.data.items.push(''); edChanged(p,true); };
      body.append(add);
    }

    if(blk.type==='choices'){
      const items=(blk.data.items||[]); while(items.length<5) items.push('');
      blk.data.items=items.slice(0,5);
      blk.data.items.forEach((c,i)=>{
        const row=elx('div','row-in');
        row.append(elx('div','mk',MARKS[i]));
        const ta=elx('textarea','ta ch-in'); ta.rows=1; ta.value=c;
        row.append(ta); body.append(row);
        ta.oninput=e=>{ blk.data.items[i]=e.target.value; edChanged(p,false); };
      });
      // 폭 게이지 — 선지가 한 단에 들어가는지 (시험지 고유 기능, 그대로 유지)
      const m=measureCh(blk.data.items);
      const pct=Math.round(m.ratio*100), L=layoutOf(p);
      const ln=L==='1'?'1줄 5개':L==='2'?'2줄 3+2':'세로';
      const g=elx('div','gauge');
      g.innerHTML=`<span>폭</span><div class="bar"><div class="fill ${pct>100?'warn':''}" `
        +`style="width:${Math.min(pct,100)}%"></div></div><b>${pct}%</b><span class="res">${ln}</span>`;
      body.append(g);
      const lab=elx('label',null,'선지 배치'); lab.style.cssText='font-size:11px;color:var(--text-tertiary);margin-top:8px;display:block';
      body.append(lab);
      const seg=elx('div','seg');
      [['auto','자동'],['1','1줄'],['2','3+2'],['v','세로']].forEach(([v,t])=>{
        const b=elx('button',null,t);
        if((blk.data.layout||'auto')===v) b.classList.add('on');
        b.onclick=()=>{ blk.data.layout=v; p.layout=v; edChanged(p,true); };
        seg.append(b);
      });
      body.append(seg);
    }

    if(blk.type==='image'){
      const row=elx('div','row-in'); row.style.alignItems='center';
      const w=elx('input','inp'); w.type='number'; w.min=0; w.max=110;
      w.value=blk.data.width||58; w.style.width='90px';
      w.oninput=e=>{ blk.data.width=Math.max(0,Math.min(110,+e.target.value||0)); edChanged(p,false); };
      row.append(w, elx('span',null,'mm 폭'));
      body.append(row);
      const src=elx('input','inp'); src.value=blk.data.src||'';
      src.placeholder='파일명 (예: fig-14.png) — 비우면 자리만 표시';
      src.oninput=e=>{ blk.data.src=e.target.value.trim().replace(/["\\]/g,''); edChanged(p,false); };
      body.append(src);
      body.append(elx('div','hint','실시간 미리보기는 serve.py 옆 work/ 폴더에, '
        +'내보낸 .typ 은 그 파일과 같은 폴더에 그림을 두세요.'));
    }

    wrap.append(body); area.append(wrap);
  });
  area.append(insertPoint(blocks.length));

  /* 맨 아래 눈에 보이는 추가 버튼 — 블록 사이 '+' 는 올려야 보여서 처음엔 찾기 어렵다 */
  const addBar=elx('div','addbar');
  Object.entries(BLK_LABELS).forEach(([v,label])=>{
    const b=elx('button','btn',v==='boxed'?'+ 박스':'+ '+label.replace(/^(문제 |답 )/,''));
    b.title=label+' 블록 추가';
    b.onclick=()=>{ blocks.push({type:v,data:blankBlockData(v)}); edChanged(p,true); };
    addBar.append(b);
  });
  root.append(addBar);

  /* ── 단 나눔 (시험지 고유) ── */
  const grp=elx('div','grp');
  const sw=elx('div','sw'); sw.append(elx('span',null,'이 문항 뒤에서 단 나눔'));
  const bt=elx('button',null,''); if(p.breakAfter) bt.classList.add('on');
  bt.onclick=()=>{ p.breakAfter=!p.breakAfter; bt.classList.toggle('on',p.breakAfter); edChanged(p,false); };
  sw.append(bt); grp.append(sw);
  grp.append(elx('div','hint',`기본 한 단 ${SPEC.perCol}문항. 각 문항은 단을 균등 분할한 자리에 고정됩니다.`));
  root.append(grp);

  host.append(root);

  // 블록 순서 드래그
  if(window.Sortable){
    if(window.__edSort) window.__edSort.destroy();
    window.__edSort=new Sortable(area,{handle:'.blk-handle',animation:150,draggable:'.block',
      onEnd:()=>{
        const order=[...area.querySelectorAll('.block')].map(el=>blocks[+el.dataset.bi]).filter(Boolean);
        if(order.length===blocks.length) p.blocks=order;
        edChanged(p,true);
      }});
  }
}

/* ── 편집 중 수식 미리보기 ──
   지문·조건·선지는 textarea 라 LaTeX 원문($\dfrac{a}{b}$ 같은 영문 명령)이 그대로 보인다.
   입력칸 바로 아래에 KaTeX 로 렌더한 결과를 같이 띄워, 오른쪽 시험지 미리보기까지
   눈을 옮기지 않고도 수식이 맞게 써졌는지 확인할 수 있게 한다. */
/* (예전에 있던 gauge() 는 지웠다. 부르는 곳이 없는 죽은 코드였고, 블록 모델로
   바뀌면서 사라진 p.choices 를 참조하고 있어 되살리면 즉시 TypeError 가 났다.
   선지 폭 표시는 renderEditor() 안에서 measureCh() 로 직접 그린다.) */

function renderOutline(){
  let h='',last='';
  state.problems.forEach(p=>{
    if(p.sect!==last){h+=`<div class="ol-sect">${p.sect==='공통'?'공통과목':'선택 · '+$('#elective').value}</div>`;last=p.sect;}
    const f=!probIsEmpty(p);
    const cb=choicesBlock(p);
    const over=p.type==='choice'&&((cb&&cb.data.layout)||p.layout)==='auto'
               &&measureCh(choiceItems(p)).ratio>1;
    h+=`<div class="ol-i ${p.id===state.sel?'sel':''} ${f?'filled':''}" data-id="${p.id}" draggable="true">
      <div class="n">${p.num}</div>
      <div class="bars"><div class="bar"></div><div class="bar" style="width:${f?70:38}%"></div></div>
      ${over?'<span class="w">↕</span>':''}<div class="p">${p.pts}</div></div>`;
  });
  $('#ol').innerHTML=h;bindOutline();
}
function bindOutline(){
  let src=null;
  document.querySelectorAll('.ol-i').forEach(el=>{
    el.onclick=()=>{state.sel=el.dataset.id;renderEditor();renderOutline();
      if(state.pvMode!=='all') renderPreview();};
    el.ondragstart=()=>{src=el;el.classList.add('drag');};
    el.ondragend=()=>{el.classList.remove('drag');document.querySelectorAll('.ol-i').forEach(x=>x.classList.remove('over'));};
    el.ondragover=e=>{e.preventDefault();if(el!==src)el.classList.add('over');};
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{
      e.preventDefault();if(!src||el===src)return;
      const P=state.problems;
      const a=P.findIndex(x=>x.id===src.dataset.id),b=P.findIndex(x=>x.id===el.dataset.id);
      const [m]=P.splice(a,1);P.splice(b,0,m);
      P.forEach((p,i)=>{const n=i+1;p.num=n;p.sect=n<=22?'공통':'선택';
        p.type=(n<=15||(n>=23&&n<=28))?'choice':'short';p.pts=PTS[n];
        syncChoicesBlock(p);});
      DIRTY=true; scheduleDraft();
      renderPreview();renderOutline();renderEditor();
    };
  });
}

/* 좌상단 기준 확대 */
/* ══════════ 확대/축소 ══════════
   .stage 에 transform:scale 을 걸고, 감싸는 .stage-wrap 이 '확대된 크기'를 그대로
   차지하게 해서 스크롤 범위가 저절로 맞도록 한다.
   (예전에는 음수 마진으로 크기를 보정해 스크롤이 어긋나고, 항상 좌상단 기준으로만
    확대돼 마우스가 가리키던 곳이 화면 밖으로 밀려났다.) */
const ZMIN=.15, ZMAX=3;

let stageNat={w:0,h:0};        // 확대 전(scale 1) 시험지 크기

/* 확대를 잠시 풀고 실제 크기를 잰다. 내용이 바뀌었을 때만 호출하면 된다. */
function measureStage(){
  const s=$('#stage'); if(!s) return;
  s.style.transform='none';
  stageNat={w:s.offsetWidth, h:s.offsetHeight};
  s.style.transform=`scale(${state.zoom})`;
}

/* remeasure=false 면 캐시된 크기를 그대로 써서, 휠로 연속 확대할 때
   매 프레임 리플로가 두 번씩 일어나는 것을 피한다. */
function applyZoom(remeasure=true){
  const s=$('#stage'), wrap=$('#stageWrap');
  if(!s||!wrap) return;
  if(remeasure||!stageNat.w) measureStage();
  const z=state.zoom;
  s.style.transform=`scale(${z})`;
  wrap.style.width =(stageNat.w*z)+'px';
  wrap.style.height=(stageNat.h*z)+'px';
  const v=$('#zVal'); if(v) v.textContent=Math.round(z*100)+'%';
}

/* 배율을 바꾸되 anchor(미리보기 안의 좌표) 지점이 제자리에 있도록 스크롤을 보정한다.
   anchor 를 안 주면 화면 중앙을 기준으로 삼는다. */
function setZoom(z, anchor){
  const pv=$('#preview'), wrap=$('#stageWrap');
  z=Math.max(ZMIN,Math.min(ZMAX,z));
  if(!pv||!wrap||z===state.zoom) return;
  const pr=pv.getBoundingClientRect();
  const vx=pr.left+(anchor?anchor.x:pv.clientWidth/2);
  const vy=pr.top +(anchor?anchor.y:pv.clientHeight/2);
  const before=wrap.getBoundingClientRect();
  // 앵커가 가리키는 지점을 '확대 전 문서 좌표'로 환산
  const docX=(vx-before.left)/state.zoom;
  const docY=(vy-before.top )/state.zoom;
  state.zoom=z;
  applyZoom(false);            // 배율만 바뀌었으니 다시 잴 필요 없다
  // 같은 문서 좌표가 다시 같은 화면 위치에 오도록 스크롤을 민다
  const after=wrap.getBoundingClientRect();
  pv.scrollLeft+=(after.left+docX*z)-vx;
  pv.scrollTop +=(after.top +docY*z)-vy;
}

/* 배율 단계는 곱셈으로 움직여야 어느 배율에서든 체감이 일정하다 */
const zoomBy=(f,anchor)=>setZoom(state.zoom*f,anchor);

/* ── 확대 감도 ──
   ZOOM_STEP : 버튼·단축키 한 번에 몇 배씩
   WHEEL_K   : 휠/트랙패드 감도. 클수록 조금만 굴려도 크게 확대된다. */
/* 확대 감도 — 슬라이더는 UI 만 어수선해서 뺐다. 예전 범위(0.4~2.5)의 80% 지점 */
const ZOOM_SENS = 2.08;
const ZOOM_STEP = () => 1 + 0.2 * ZOOM_SENS;
const WHEEL_K   = () => 0.0025 * ZOOM_SENS;

/* 폭에 맞추는 배율 */
function fitZoom(){
  const pv=$('#preview');
  if(!pv) return 1;
  measureStage();
  const w=stageNat.w||272*MM;
  return Math.max(ZMIN,Math.min(ZMAX,(pv.clientWidth-48)/w));   // 48 = 좌우 패딩
}
function fitWidth(){
  state.zoom=fitZoom();
  applyZoom(false);
  const pv=$('#preview'); pv.scrollTop=0; pv.scrollLeft=0;
}

$('#zIn').onclick=()=>{pvUserZoomed=true;zoomBy(ZOOM_STEP());};
$('#zOut').onclick=()=>{pvUserZoomed=true;zoomBy(1/ZOOM_STEP());};
$('#zVal').onclick=()=>{pvUserZoomed=true;setZoom(1);};
/* 맞춤: 폭 맞추기 ↔ 100% 를 번갈아 */
$('#zFit').onclick=()=>{
  pvUserZoomed=true;
  const fit=fitZoom();
  if(Math.abs(state.zoom-fit)<.01) setZoom(1);
  else fitWidth();
};

/* ⌘/Ctrl + 휠 (맥 트랙패드 핀치 포함) — 커서가 가리키는 지점을 기준으로 확대 */
$('#preview').addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;
  e.preventDefault();
  pvUserZoomed=true;
  const pr=$('#preview').getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY*WHEEL_K()),{x:e.clientX-pr.left,y:e.clientY-pr.top});
},{passive:false});

/* 빈 곳을 드래그해서 시험지를 밀어 볼 수 있게 (확대했을 때 편하다) */
(function enableDragPan(){
  const pv=$('#preview');
  if(!pv) return;
  let on=false,sx=0,sy=0,sl=0,st=0;
  pv.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    // 글자 선택이나 버튼 클릭을 방해하지 않도록 여백에서 시작할 때만
    if(e.target.closest('.pg,.errbox,button,input,textarea,select')) return;
    on=true;sx=e.clientX;sy=e.clientY;sl=pv.scrollLeft;st=pv.scrollTop;
    pv.setPointerCapture(e.pointerId); pv.style.cursor='grabbing';
  });
  pv.addEventListener('pointermove',e=>{
    if(!on)return;
    pv.scrollLeft=sl-(e.clientX-sx); pv.scrollTop=st-(e.clientY-sy);
  });
  const end=()=>{on=false;pv.style.cursor='';};
  pv.addEventListener('pointerup',end); pv.addEventListener('pointercancel',end);
})();
/* ── 테마 ──
   전환 버튼은 PEDAGOGY 본체 상단바에 있다. 여기서는 값을 '따라가기만' 한다.
     · 단독으로 열렸을 때: localStorage(PM_THEME) 를 읽어 적용
     · iframe 으로 열렸을 때: 본체가 이 문서의 data-theme 을 직접 걸어 준다
     · 다른 탭/문서에서 바뀌면 storage 이벤트로 따라간다 */
const THEME_KEY='PM_THEME';
function paintThemeSelf(v){
  const r=document.documentElement;
  if(!v||v==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',v);
}
(function(){
  try{ paintThemeSelf(localStorage.getItem(THEME_KEY)); }catch(e){ console.error(e); }
})();
window.addEventListener('storage',e=>{
  if(e.key===THEME_KEY){ paintThemeSelf(e.newValue); renderPreview(); }
});

/* ── 미리보기 범위 (이 문항 / 전체보기) ── */
function markStale(on){
  const seg=$('#pvMode'); if(!seg) return;
  seg.classList.toggle('stale', !!on && state.pvMode==='all');
}
/* 모드마다 보기 좋은 배율이 다르다(한 문항은 크게, 시험지는 쪽 전체가 보이게).
   전환할 때 이전 배율을 기억해 두고, 처음 들어가는 모드는 폭에 맞춰 띄운다. */
const PV_ZOOM_MEM={one:null, all:null};
/* 사용자가 배율을 직접 만지기 전까지는 렌더할 때마다 폭에 맞춘다.
   렌더 타이밍(근사→정본, 이미지 로드)에 따라 한 번짜리 플래그는 자꾸 어긋났다. */
let pvUserZoomed=false;

function setPvMode(v){
  if(v===state.pvMode && v!=='all') return;
  PV_ZOOM_MEM[state.pvMode]=state.zoom;      // 지금 모드의 배율 기억
  state.pvMode=v;
  if(PV_ZOOM_MEM[v]!=null){ state.zoom=PV_ZOOM_MEM[v]; pvUserZoomed=true; }
  else pvUserZoomed=false;                   // 처음 들어가는 모드면 폭에 맞춘다
  const seg=$('#pvMode');
  if(seg) seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  markStale(false);
  LIVE.cache.clear();          // 두 모드의 쪽 크기가 달라 캐시를 섞으면 안 된다
  if(LIVE.on) requestRenderNow();
  else renderPreview();
}
/* 렌더가 끝난 뒤(내용 크기가 정해진 뒤) 폭에 맞춘다.
   사용자가 배율을 직접 조절한 뒤에는 건드리지 않는다. */
function applyPendingFit(){
  if(pvUserZoomed) return;
  // rAF 는 탭이 숨겨져 있으면(백그라운드·창 최소화) 콜백이 오지 않아
  // 배율이 영영 안 맞춰진다. 레이아웃이 정해질 시간만 짧게 주고 실행한다.
  setTimeout(()=>{ if(!pvUserZoomed) fitWidth(); },30);
}

/* 전체보기는 requestRender 가 막으므로 직접 부른다 */
function requestRenderNow(){
  clearTimeout(LIVE.timer);
  if(LIVE.busy){ LIVE.pending=true; return; }
  doRender();
}
(function(){
  const seg=$('#pvMode'); if(!seg) return;
  seg.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.v==='all' && state.pvMode==='all'){ // 이미 전체보기면 '다시 그리기'
        markStale(false); if(LIVE.on) requestRenderNow(); return;
      }
      setPvMode(b.dataset.v);
    };
  });
})();

$('#errClose').onclick=()=>showErr('');
$('#guideBtn').onclick=e=>{state.guides=!state.guides;e.target.classList.toggle('on',state.guides);renderPreview();};
$('#round').oninput=renderPreview;
$('#elective').onchange=()=>{renderPreview();renderOutline();};

    place(top + left, dx: 0mm, dy: 39.0mm,
      box(width: PW)[#align(center)[

        #scale(x: 90%, reflow: true)[#text(font: F-AREA, size: 40pt * K-AREA, tracking: -1.2pt)[#area]]]])
    place(top + right, dx: -MG, dy: 21.8mm, text(font: F-PNO, size: 29.7pt * K-PNO, weight: "bold")[#pageno])

    } else {
      place(top + left, dx: MG, dy: 23.4mm, text(font: F-PNO, size: 29.7pt * K-PNO, weight: "bold")[#pageno])
    }
  }

  // 가로 괘선 / 세로 단 구분선
  place(top + left, dx: MG, dy: ruleY, line(length: BW, stroke: 0.6mm))
  place(top + left, dx: 136.40mm, dy: ruleY,
        line(angle: 90deg, length: BOT - ruleY, stroke: 0.25mm))

  // 구획 태그 — 괘선 아래 4.49mm (1쪽 실측 y=63.97 기준)
  let tagY = ruleY + 4.49mm
  if tag-l != none { place(top + left, dx: 18.84mm, dy: tagY, tag-l) }
  if tag-r != none { place(top + left, dx: 141.18mm, dy: tagY, tag-r) }

    box(width: BW, height: bodyH)[
      #grid(columns: (CW, CW), column-gutter: CG,
        box(width: CW, height: bodyH)[
          #column-slots(left-items, pad-top: if tag-l != none { 19.5mm } else { 0mm })
        ],
        box(width: CW, height: bodyH)[
          #column-slots(right-items, pad-top: if tag-r != none { 19.5mm } else { 0mm })
        ])
    ])

  // 확인 사항 — 본문 영역의 오른쪽·아래 끝에 붙임 (09 정본과 동일한 기준)
  if note != none {
    place(bottom + left, dx: MG + BW - NOTEW, dy: -(PH - BOT), note)
  }

  // 꼬리말 쪽수
  place(top + left, dx: (PW - 17.7mm) / 2, dy: 364.66mm, pfoot(sheetno, total))
}
`;

/* ── Typst 마크업 이스케이프 ──
   Typst에서 특별한 뜻을 갖는 문자를 본문 텍스트로 내보낼 때 막아준다. */
/* Typst 마크업 안에서 특별한 뜻을 갖는 글자를 모두 막는다.
   '/' 가 빠져 있었다 — Typst 에서 '//' 는 줄 주석이라, 본문에 "a // b" 처럼
   쓰면 그 줄의 나머지가 통째로 주석이 되면서 내용 블록을 닫는 ']' 까지
   먹어 버렸다. 결과는 `error: unclosed delimiter` — 정본 출력 자체가 실패.
   ('/*' 는 '*' 가 이미 이스케이프돼 우연히 막혀 있었지만, 명시적으로 함께 막는다)
   '#' 를 막기 때문에 사용자 텍스트가 Typst 함수 호출로 실행될 수는 없다. */
function tq(s){return String(s).replace(/([\\#$\[\]*_`<>@~\/])/g,'\\$1');}
/* Typst 문자열 리터럴("...") 안에 넣을 때 */
function tqs(s){return String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');}
/* LaTeX → MiTeX 호출. disp=true면 별행(디스플레이) 수식 */
/* cases 환경의 열 구분 & 는 Typst에서 폭이 0이라 조건이 식에 바로 붙는다.
   평가원 원본처럼 띄우려면 \quad 을 넣어줘야 한다. */
function fixCases(s){
  return s.replace(/\\begin\{cases\}[\s\S]*?\\end\{cases\}/g,
    m=>m.replace(/&(?!\s*\\quad)/g,'&\\quad '));
}
function texToTypst(latex,disp){
  const src=fixCases(String(latex).replace(/`/g,"'").replace(/\r?\n/g,' '));
  return '#'+(disp?'mitex':'mi')+'(`'+src+'`)';
}
/* $...$ 이 섞인 한 줄 → Typst 마크업.
   수식 바로 뒤의 '.' '(' 는 필드접근·함수호출로 잘못 읽히므로 이스케이프한다.
   (검증: `#mi(`x`).이다` → error / `#mi(`x`)\.이다` → 정상) */
function tline(s){
  const segs=String(s).split(/(\$[^$]*\$)/g);let out='',eq=false;
  segs.forEach(seg=>{
    if(!seg)return;
    if(seg.length>2&&seg.startsWith('$')&&seg.endsWith('$')){
      out+=texToTypst(seg.slice(1,-1),false);eq=true;
    }else{
      let t=tq(seg);
      if(eq&&/^[.(]/.test(t))t='\\'+t;
      out+=t;eq=false;
    }
  });
  return out;
}

/* 한 문항 → Typst 조각 (sheet의 left-items/right-items 원소 안에 들어간다) */
function probTypst(p){
  const PM=`#ptsmark(${p.pts})`, IND='\n     ';
  const {units,ptsAt}=probUnits(p);
  if(probIsEmpty(p))
    return `// ${p.num}번 — 발문 비어 있음${IND}#probhead(${p.num})[ ]`;
  // 본문이 딱 한 줄뿐이면 번호·배점을 한 줄에 붙이는 #prob 를 쓴다(기존 동작 유지)
  const single = units.filter(u=>u.k!=='choices').length===1 && units[0] && units[0].k==='text';
  const out=[], push=x=>{ if(x) out.push(x); };
  let first=true;
  units.forEach((u,i)=>{
    const tail = i===ptsAt ? ' '+PM : '';
    if(u.k==='text'){
      if(first){
        push(single ? `#prob(${p.num}, ${p.pts})[${tline(u.t)}]`
                    : `#probhead(${p.num})[${tline(u.t)}${tail}]`);
        first=false;
      } else push(`#contline[${tline(u.t)}${tail}]`);
    }
    else if(u.k==='eq')   push(`#dispeq[${texToTypst(u.t.slice(1,-1),true)}${tail}]`);
    else if(u.k==='cond') push(`#condbox(${u.items.map(c=>`\n       [${tline(c)}],`).join('')}\n     )`);
    else if(u.k==='ex')   push(`#exbox(${u.items.map((c,j)=>`\n       [${tq(HGND[j%HGND.length])}. ${tline(c)}],`).join('')}\n     )`);
    else if(u.k==='boxed')push(`#condbox(\n       [${tline(u.t)}],\n     )`);
    /* 그림 경로 앞의 '/' 는 Typst 에서 '루트 기준 절대경로' 라는 뜻이다.
       상대경로로 두면 실시간 렌더에서 그림을 절대 못 찾는다 — serve.py 가
       main.typ 을 work/ 밑 '임시 폴더' 에 쓰기 때문에 work/fig.png 에 파일을
       둬도 work/tmpXXXX/fig.png 를 뒤진다(실제로 file not found 가 났다).
       '/' 를 붙이면 실시간에서는 --root 인 work/ 를, 내보낸 .typ 을 직접
       컴파일할 때는 그 .typ 이 있는 폴더를 가리켜 양쪽 다 맞는다. */
    else if(u.k==='fig')  push(u.src
        ? `#figbox[#image("/${tqs(u.src)}", width: ${u.w}mm)]`
        // 안내 주석은 반드시 '앞줄'에 둔다. 뒤에 붙이면 Typst 의 // 주석이
        // 줄 끝까지 먹어서, 이 항목을 닫는 ], 까지 주석 처리돼 컴파일이 깨진다.
        : `// 그림 파일을 지정하면 #figbox[#image("...", width: ${u.w}mm)] 로 바뀝니다\n     `
          +`#figplace(${u.w}mm)[그림 ${p.num}]`);
    else if(u.k==='choices'){
      const L=layoutOf(p), fn=L==='1'?'ch1':L==='2'?'ch2':'chv';
      push(`#${fn}(${u.items.map((c,j)=>`[${MARKS[j]} ${tline(c)}]`).join(', ')})`);
    }
  });
  return out.join(IND);
}

/* 한 쪽 → #sheet(...) 호출 */
function sheetTypst(pg,M,meta,total,round,elec){
  const area=M.sect==='선택'?`수학 영역(${elec})`:'수학 영역';
  const col=ci=>{
    const c=pg[ci]||[];
    if(!c.length)return '()';
    return '(\n    '+c.map((p,i)=>{
      const tag=i>0&&isGroupFirst(p)?`#sectag-inline("${tagName(p)}")\n     `:'';
      return `[${tag}${probTypst(p)}],`;
    }).join('\n    ')+'\n  )';
  };
  const tl=tagOf(pg[0]),tr=tagOf(pg[1]),note=noteFor(meta,M.sheetno-1,elec);
  const a=[`#sheet(${M.pageno}, "${tqs(area)}",`];
  if(M.first)a.push(`  round: "${tqs(round)}",`);
  a.push(`  sheetno: ${M.sheetno}, total: ${total},`);
  if(tl)a.push(`  tag-l: sectag("${tl}"),`);
  if(tr)a.push(`  tag-r: sectag("${tr}"),`);
  if(note)a.push(`  note: notebox(${note.map(x=>`\n    [${tq(x)}],`).join('')}\n  ),`);
  a.push(`  left-items: ${col(0)},`);
  a.push(`  right-items: ${col(1)})`);
  return a.join('\n');
}

/* ── 한 문항만 렌더하는 소스 ──
   전체 시험지(8쪽)를 타이핑마다 다시 컴파일하는 건 느리고, 편집 중인 문항을
   여러 쪽에서 찾아야 해서 불편하다. 평소에는 이 소스로 '지금 문항'만 띄운다.
   판형·글꼴·단 폭(CW)을 정본과 똑같이 쓰므로 줄바꿈 위치도 정본과 같다. */
function oneProbTypst(p){
  const PAD='7mm';
  return TYPST_FRAME.replace(
      '#set page(width: PW, height: PH, margin: 0pt)',
      `#set page(width: CW + 2 * ${PAD}, height: auto, margin: ${PAD})`)
    + '\n\n' + probTypst(p) + '\n';
}

function typstSource(){
  const round=$('#round').value,elec=$('#elective').value;
  const pages=buildPages(),meta=pageMeta(pages);
  const total=pages.length;
  const head=`// ═══════════════════════════════════════════════════════════════
//  ${round} — 선택: ${elec}
//  PEDAGOGY 모의고사 편집기 자동 생성 · 정본은 로컬 typst 렌더링
//
//  typst compile --font-path ~/exam-fonts --font-path "/Applications/Hancom Office HWP.app/Contents/Resources/Hnc/Shared/TTF/Hwp" ${round.replace(/\s+/g,'_')}.typ
// ═══════════════════════════════════════════════════════════════
`+TYPST_FRAME;
  const body=pages.map((pg,i)=>{
    const M=meta[i];
    return `// ════════ ${M.sect} ${M.pageno}쪽 (통 ${M.sheetno}쪽) ════════\n`
      +sheetTypst(pg,M,meta,total,round,elec);
  }).join('\n\n#pagebreak()\n\n');
  return head+'\n'+body+'\n';
}
function toTypst(){
  const src=typstSource();
  const name=$('#round').value.replace(/\s+/g,'_')+'_'+$('#elective').value.replace(/\s+/g,'')+'.typ';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([src],{type:'text/plain;charset=utf-8'}));
  a.download=name;a.click();
}

/* ══════════ 실시간 렌더 ══════════
   serve.py 가 떠 있으면 정본과 똑같은 typst·글꼴로 컴파일해서 그 결과를 띄운다.
   서버가 없으면 기존 CSS 근사 미리보기로 자동으로 돌아간다. */
const LIVE={on:false,busy:false,pending:false,timer:null,cache:new Map(),ppi:110,base:'',webfonts:[]};
/* 로컬 서버가 띄운 페이지면 같은 출처(''), 깃허브 페이지 등에서 열었으면
   내 컴퓨터의 렌더 서버 주소를 직접 부른다. 크롬은 https 페이지에서
   로컬 주소를 부를 때 서버의 허가 헤더를 요구하는데 serve.py 가 붙여 준다. */
const LIVE_PORTS=[8787,8788,8080];
async function probe(base){
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),1500);
    const r=await fetch(base+'/health',{headers:{'X-Exam-Client':'1'},signal:c.signal});
    clearTimeout(t);
    if(!r.ok)return false;
    const d=await r.json();
    if(d.ok) LIVE.webfonts=Array.isArray(d.webfonts)?d.webfonts:[];
    return !!d.ok;
  }catch(e){return false;}
}

/* ── 시험 글꼴을 로컬 서버에서 웹폰트로 받아오기 ──
   @font-face 의 local() 로 시스템 글꼴을 쓰는 방식은 사파리에서 막힌다
   (지문 추적 방지 목적). 그래서 로컬 서버가 떠 있으면 글꼴 파일 자체를 내려받아
   어느 브라우저에서든 미리보기가 정본과 같은 서체가 되게 한다.
   서버가 없으면 아무것도 하지 않고 기존 local()/웹폰트 폴백 그대로 둔다. */
const WEBFONT_MAP=[
  ['ExamBody',    ['A053SinMyungjo.ttf','A053SinMyungjo95.ttf']],
  ['ExamGraphic', ['9972E83A5CE718D41B.ttf','SinGraphic.ttf','신그래픽체.ttf']],
  ['ExamRound',   ['UnDinaru.ttf']],
];
let webfontsInjected=false;
function injectServerWebfonts(){
  if(webfontsInjected) return;
  const avail=LIVE.webfonts||[];
  if(!avail.length) return;
  const base=LIVE.base||'';
  const rules=[];
  for(const [family,candidates] of WEBFONT_MAP){
    const hit=candidates.find(n=>avail.includes(n));
    if(!hit) continue;
    // local() 을 먼저 둬서 크롬처럼 이미 되는 브라우저는 네트워크를 타지 않는다
    rules.push(`@font-face{font-family:'${family}';font-display:swap;`
      +`src:local('${family}'),url('${base}/font/${encodeURIComponent(hit)}') format('truetype')}`);
  }
  if(!rules.length) return;
  const st=document.createElement('style');
  st.id='serverWebfonts';
  st.textContent=rules.join('\n');
  document.head.appendChild(st);
  webfontsInjected=true;
  // 글꼴이 실제로 준비되면 폭 계산이 달라지므로 다시 그린다
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>renderPreview());
}
async function pingServer(){
  if(await probe('')){LIVE.base='';return true;}          // 같은 출처 우선
  for(const p of LIVE_PORTS){
    const b='http://127.0.0.1:'+p;
    if(await probe(b)){LIVE.base=b;return true;}
  }
  return false;
}
function setLive(on){
  LIVE.on=on;
  const b=$('#liveBtn');if(b)b.classList.toggle('on',on);
  pvUserZoomed=false;   // 근사↔정본은 그려지는 크기가 달라 다시 맞춘다
  if(on)requestRender(0); else {LIVE.cache.clear();showErr('');renderPreview();}
}
/* 안내 상자. kind='info' 면 오류가 아니라 안내로 보여준다.
   (서버가 안 떠 있다는 안내에 'Typst 오류' 딱지가 붙어 혼란스러웠다) */
function showErr(t, title, kind){
  const box=$('#errbox');if(!box)return;
  if(t&&t.trim()){
    $('#errttl').textContent=title||'Typst 오류';
    $('#errtxt').textContent=t.trim();
    box.classList.toggle('info', kind==='info');
    box.hidden=false;
  }
  else box.hidden=true;
}

/* '실시간'을 켤 수 없을 때의 안내. 어디서 열었는지에 따라 해야 할 일이 다르다. */
function showNoServer(){
  const local=location.protocol.startsWith('http')&&/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const msg = local
    ? `이 페이지를 연 주소(${location.host})에서 렌더 서버를 찾지 못했습니다.\n`
      +`터미널에서 python3 serve.py 가 실행 중인지 확인해 주세요.`
    : `'실시간'은 내 컴퓨터에서 Typst 로 직접 조판한 결과를 보여주는 기능이라,\n`
      +`로컬 렌더 서버가 필요합니다.\n\n`
      +`  1) 터미널에서:  python3 serve.py --open\n`
      +`  2) 열리는 http://127.0.0.1:8787 에서 편집기를 사용\n\n`
      +`지금처럼 ${location.host} 에서 열어 두고 써도 되지만, 브라우저가 보안상\n`
      +`외부 사이트 → 내 컴퓨터 주소 호출을 막는 경우가 있습니다(특히 사파리).\n`
      +`그때는 위 2번 주소로 직접 열면 확실합니다.\n\n`
      +`서버 없이도 편집과 근사 미리보기, Typst 내보내기는 그대로 됩니다.`;
  showErr(msg, '실시간 미리보기 — 로컬 서버 필요', 'info');
}
function requestRender(delay=400){
  if(!LIVE.on)return;
  // 전체보기는 무거우므로 편집할 때마다 다시 그리지 않는다. '전체보기' 를 다시
  // 누르면 그때 갱신된다(그 사이에는 마지막으로 그린 시험지가 그대로 남는다).
  if(state.pvMode==='all'){ markStale(true); return; }
  clearTimeout(LIVE.timer);
  LIVE.timer=setTimeout(()=>{
    if(LIVE.busy){LIVE.pending=true;return;}
    doRender();
  },delay);
}
async function doRender(){
  LIVE.busy=true;$('#stage').classList.add('busy');
  try{
    // 'one' = 지금 문항만(빠름, 실시간) · 'all' = 시험지 전체(버튼을 눌렀을 때만)
    const one=state.pvMode!=='all';
    const cur=state.problems.find(x=>x.id===state.sel);
    const src=(one&&cur)?oneProbTypst(cur):typstSource();
    const r=await fetch(LIVE.base+'/render',{method:'POST',
      headers:{'Content-Type':'application/json','X-Exam-Client':'1'},
      body:JSON.stringify({typ:src,ppi:livePpi(),known:[...LIVE.cache.keys()]})});
    const d=await r.json();
    if(!d.ok){showErr(d.log||d.error||'컴파일 실패');}
    else{
      showErr(d.log&&/error/i.test(d.log)?d.log:'');
      const st=$('#stage');st.innerHTML='';
      for(const p of d.pages){
        if(p.png)LIVE.cache.set(p.hash,'data:image/png;base64,'+p.png);
        const url=LIVE.cache.get(p.hash);
        const img=document.createElement('img');
        img.className='live-pg';img.src=url||'';img.alt=p.n+'쪽';
        if(one){ // 한 문항 모드는 높이가 내용에 따라 달라진다 — 폭만 단 폭에 맞춘다
          img.style.width=(SPEC.colW+14)+'mm'; img.style.height='auto';
        }else{
          img.style.width=SPECPG.w+'mm';img.style.height=SPECPG.h+'mm';
        }
        st.appendChild(img);
      }
      // 캐시가 너무 커지지 않게
      if(LIVE.cache.size>60)LIVE.cache.clear();
      applyZoom();
      applyPendingFit();     // 모드를 처음 열었으면 폭에 맞춰 띄운다
    }
  }catch(e){
    showErr('렌더 서버와 연결이 끊겼습니다. serve.py 가 아직 떠 있는지 확인해 주세요.\n\n'+e,
            '렌더 서버 연결 끊김');
    setLive(false);
  }finally{
    LIVE.busy=false;$('#stage').classList.remove('busy');
    if(LIVE.pending){LIVE.pending=false;requestRender(120);}
  }
}
const SPECPG={w:272,h:394.1};
/* 화면에 실제로 찍히는 밀도에 맞춘 해상도 — 확대하면 더 선명하게 받는다 */
/* 실시간 렌더 해상도.
   화면에 그려질 실제 픽셀(배율 × DPR)에 맞춰야 선명하다. 예전에는 200 에서 잘려,
   레티나에서 176% 로 키우면 필요한 값의 절반밖에 안 돼 뭉개져 보였다.
   전체 시험지는 8쪽을 한꺼번에 만들어 무거우므로 상한을 따로 둔다. */
function livePpi(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const want=96*state.zoom*dpr*1.15;
  const cap=state.pvMode==='all'?260:400;   // 한 문항이면 넉넉히
  return Math.round(Math.max(72,Math.min(cap,want)));
}

$('#exportBtn').onclick=toTypst;

/* 불러온 JSON 을 그대로 믿지 않고 형식을 맞춘다 */
/* 불러온 블록을 화이트리스트로 정규화 — 모르는 종류·필드는 버린다 */
function normBlockM(b,S){
  if(!b||typeof b!=='object'||!BLK_LABELS[b.type]) return null;
  const d=(b.data&&typeof b.data==='object')?b.data:{};
  if(b.type==='statement'||b.type==='boxed') return {type:b.type,data:{text:S(d.text,'')}};
  if(b.type==='conditions'||b.type==='examples')
    return {type:b.type,data:{items:(Array.isArray(d.items)?d.items:[]).slice(0,8).map(x=>S(x,''))}};
  if(b.type==='choices'){
    const a=(Array.isArray(d.items)?d.items:[]).slice(0,5).map(x=>S(x,''));
    while(a.length<5) a.push('');
    return {type:'choices',data:{items:a,layout:['auto','1','2','v'].includes(d.layout)?d.layout:'auto'}};
  }
  return {type:'image',data:{width:Math.max(0,Math.min(110,+d.width||0)),
                             src:S(d.src,'').replace(/["\\]/g,'')}};
}

function sanitize(base,p){
  if(!p||typeof p!=='object')return base;
  const S=(v,d)=>typeof v==='string'?v.slice(0,4000):d;
  const o=Object.assign({},base);
  o.sect=p.sect==='선택'?'선택':'공통';
  o.type=p.type==='short'?'short':'choice';
  o.pts=[2,3,4].includes(+p.pts)?+p.pts:base.pts;
  o.layout=['auto','1','2','v'].includes(p.layout)?p.layout:'auto';
  o.breakAfter=!!p.breakAfter;
  // 블록이 있으면 화이트리스트로 정규화, 없으면 예전 형식에서 변환한다
  if(Array.isArray(p.blocks)&&p.blocks.length){
    o.blocks=p.blocks.slice(0,40).map(b=>normBlockM(b,S)).filter(Boolean);
  }else{
    o.blocks=legacyToBlocks({
      stmt:S(p.stmt,''),
      conds:Array.isArray(p.conds)?p.conds.slice(0,6).map(x=>S(x,'')):[],
      useCond:!!p.useCond,
      choices:Array.isArray(p.choices)?[0,1,2,3,4].map(i=>S(p.choices[i],'')):[],
      layout:o.layout, type:o.type,
      figure:Math.max(0,Math.min(110,+p.figure||0)),
      figSrc:S(p.figSrc,'').replace(/["\\]/g,''),
    });
  }
  if(!o.blocks.length) o.blocks=[{type:'statement',data:{text:''}}];
  return o;
}
let DIRTY=false;

/* 비침습 토스트 (본체 PEDAGOGY 와 같은 UX — alert 로 흐름을 끊지 않는다) */
function toast(msg,type){
  let host=document.getElementById('toastHost');
  if(!host){host=document.createElement('div');host.id='toastHost';document.body.appendChild(host);}
  const t=document.createElement('div');
  t.className='toast'+(type?' toast--'+type:'');
  t.textContent=msg;
  host.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),320);},type==='error'?3600:2400);
}

/* ── 작업 저장·불러오기 ──
   정식 저장은 .json 파일이지만, 브라우저가 죽으면 전부 날아가므로
   localStorage 에 임시본을 함께 남긴다(다음 진입 때 복구 여부를 묻는다). */
const DRAFT_KEY='MOCK_DRAFT_V1';

function currentData(){
  return {v:1,round:$('#round').value,elective:$('#elective').value,problems:state.problems};
}

function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({...currentData(), savedAt:Date.now()})); }
  catch(e){ console.error('임시저장 실패(용량 초과 가능)', e); }
}

/* 편집이 멈춘 뒤 1초 후 임시저장 — 타이핑마다 직렬화하지 않는다 */
let draftTimer=null;
function scheduleDraft(){ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,1000); }

function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){ console.error(e); }
}

function applyData(d){
  if(d.round)$('#round').value=d.round;
  if(d.elective)$('#elective').value=d.elective;
  if(Array.isArray(d.problems)&&d.problems.length)
    state.problems=d.problems.slice(0,60).map((p,i)=>sanitize(blank(i+1),p));
  state.sel=state.problems[0].id;
  renderPreview();renderEditor();renderOutline();
}

/* 직전 세션이 저장 없이 끝났으면 복구를 제안한다 */
function offerDraftRestore(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); }
  catch(e){ console.error('임시저장 데이터를 읽지 못했습니다', e); }
  if(!d||!Array.isArray(d.problems)||!d.problems.length) return;
  const when=d.savedAt?new Date(d.savedAt).toLocaleString('ko-KR'):'이전';
  if(confirm(`저장하지 않고 종료된 작업이 있습니다.\n(${when})\n\n복구할까요?`)){
    try{ applyData(d); toast('임시저장본을 복구했어요','success'); clearDraft(); }
    catch(e){ console.error(e); toast('복구에 실패했어요','error'); showDraftButton(); }
  }else{
    /* ⚠️ 여기서 clearDraft() 를 부르면 안 된다.
       예전에는 취소를 누른 순간 임시저장을 영구 삭제했다. 그런데 '취소' 는
       "이따 할게" 이거나 ESC 오조작인 경우가 대부분이다. 밤새 작업한 내용이
       버튼 한 번에 사라졌다.
       이제는 백업을 그대로 두고, 툴바에 복구 버튼만 띄워 둔다.
       임시저장은 사용자가 .json 으로 저장할 때(saveJSON) 정리된다. */
    showDraftButton();
    toast('임시저장본은 그대로 뒀어요 · 위 ↩︎ 버튼으로 언제든 복구할 수 있어요');
  }
}

/* 임시저장이 남아 있으면 툴바에 복구 버튼을 띄운다 */
function showDraftButton(){
  const b=$('#draftBtn'); if(!b) return;
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); }catch(e){}
  if(!d||!Array.isArray(d.problems)||!d.problems.length){ b.style.display='none'; return; }
  const when=d.savedAt?new Date(d.savedAt).toLocaleString('ko-KR'):'이전';
  b.style.display='';
  b.title=`저장하지 않고 종료된 작업 (${when})`;
  b.onclick=()=>{
    if(!confirm(`임시저장본으로 되돌릴까요?\n(${when})\n\n지금 화면의 내용은 사라집니다.`)) return;
    try{ applyData(d); clearDraft(); b.style.display='none'; toast('임시저장본을 복구했어요','success'); }
    catch(e){ console.error(e); toast('복구에 실패했어요','error'); }
  };
}

function saveJSON(){
  const data=currentData();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
  a.download=$('#round').value.replace(/\s+/g,'_')+'.json';a.click();
  DIRTY=false;
  clearDraft();                 // 파일로 저장했으니 임시본은 필요 없다
  toast('저장했어요','success');
}
$('#saveBtn').onclick=saveJSON;

/* ── 단축키 ──
   ⌘S 저장 · ⌘E 내보내기 · ⌥↑/↓ 문항 이동 */
document.addEventListener('keydown',e=>{
  const cmd=e.metaKey||e.ctrlKey;
  if(cmd&&e.key.toLowerCase()==='s'){e.preventDefault();saveJSON();return;}
  if(cmd&&e.key.toLowerCase()==='e'){e.preventDefault();toTypst();return;}
  // ⌘+ / ⌘− / ⌘0 — 브라우저 자체 확대 대신 시험지 배율을 조절한다
  if(cmd&&(e.key==='='||e.key==='+')){e.preventDefault();pvUserZoomed=true;zoomBy(ZOOM_STEP());return;}
  if(cmd&&(e.key==='-'||e.key==='_')){e.preventDefault();pvUserZoomed=true;zoomBy(1/ZOOM_STEP());return;}
  if(cmd&&e.key==='0'){e.preventDefault();pvUserZoomed=true;setZoom(1);return;}
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    const i=state.problems.findIndex(x=>x.id===state.sel);
    const j=Math.max(0,Math.min(state.problems.length-1,i+(e.key==='ArrowDown'?1:-1)));
    state.sel=state.problems[j].id;renderEditor();renderOutline();
  }
});

/* 저장 안 한 채로 닫으려 하면 경고 + localStorage 임시저장 */
document.addEventListener('input',()=>{DIRTY=true;scheduleDraft();});
window.addEventListener('beforeunload',e=>{
  if(DIRTY){ saveDraft(); e.preventDefault(); e.returnValue=''; }
});
$('#loadInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      applyData(JSON.parse(r.result));
      DIRTY=false; clearDraft();
      toast('불러왔어요','success');
    }catch(err){ console.error(err); toast('불러오기 실패: '+err.message,'error'); }
  };
  r.readAsText(f);e.target.value='';
};

async function boot(){
  // 첫 화면도 폭에 맞춘다. '이 문항' 이 기본 모드라 setPvMode 를 거치지 않아,
  // 예전에는 기본 배율(60%) 그대로여서 문항 하나가 허공에 뜬 조각처럼 보였다.
  pvUserZoomed=false;
  // PEDAGOGY 본체 안에 iframe 으로 들어간 경우 — 위쪽에 이미 같은 로고가 있으므로
  // 이 문서의 로고는 숨긴다(상단 로고가 두 개로 보이던 문제).
  try{ if(window.self!==window.top) document.body.classList.add('embedded'); }
  catch(e){ document.body.classList.add('embedded'); }   // 교차 출처면 iframe 으로 본다

  renderPreview();renderEditor();renderOutline();

  offerDraftRestore();          // 저장 없이 끝난 직전 작업이 있으면 복구 제안
  $('#liveBtn').onclick=async()=>{
    if(LIVE.on)return setLive(false);
    if(await pingServer()){ injectServerWebfonts(); setLive(true); }
    else showNoServer();
  };
  if(location.protocol.startsWith('http')&&await pingServer()){
    injectServerWebfonts();     // 실시간을 켜지 않아도 서체는 정본과 맞춰 둔다
    setLive(true);
  }
  else if(location.protocol.startsWith('http'))
    console.info('로컬 렌더 서버 없음 — 근사 미리보기로 동작합니다.');
}
if(window.katex)boot(); else window.addEventListener('load',boot);
document.fonts&&document.fonts.ready.then(()=>{renderPreview();});
</script>
</body>
</html>
