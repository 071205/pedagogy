<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>U0 연결 시안</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  U0 연결 시안 — 모의 데이터로 그린 화면 전이 시안이다.
  ⚠️ 제품 코드가 아니다. app 의 어떤 파일도 부르지 않고 어떤 저장소에도 쓰지 않는다.
  ⚠️ 화면 크기 전환은 **모의 프레임의 data-size** 로 구동한다 — 실제 브라우저 창 크기에
     반응하는 media query 를 쓰면 시안을 1194 로 보면서 375 를 검토할 수 없다.
  근거 계약: docs/PRODUCT-UX-U0-CONTRACT.md · docs/PRODUCT-UX-DESIGN.md · docs/STORAGE-CONTRACT.md
-->
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --line-strong:#cdd3da;
  --text:#191f28; --text-2:#4e5968; --text-3:#8b95a1;
  --blue:#3182F6; --blue-text:#2B6FD6; --blue-weak:#eaf2fe;
  --ok:#0f8f57; --ok-weak:#e6f6ee; --warn:#b26a00; --warn-weak:#fdf3e2;
  --bad:#c8352c; --bad-weak:#fdeceb; --wait:#5b6a7d; --wait-weak:#eef1f4;
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1e2228; --line:#2c323a; --line-strong:#3c444e;
    --text:#e9edf2; --text-2:#aeb8c4; --text-3:#7d8794;
    --blue:#4d94ff; --blue-text:#7fb2ff; --blue-weak:#16273e;
    --ok:#4cc38a; --ok-weak:#12301f; --warn:#e0a34a; --warn-weak:#33260f;
    --bad:#f07068; --bad-weak:#36191a; --wait:#9aa6b4; --wait-weak:#232a32;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;
  font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}

/* ── 시안 껍데기 ───────────────────────────────────────────────── */
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.mockbar{background:var(--warn-weak);border:1px solid var(--warn);color:var(--warn);
  border-radius:var(--radius);padding:10px 14px;font-weight:700;margin-bottom:14px}
.mockbar span{font-weight:400;color:var(--text-2);display:block;margin-top:3px;font-size:12.5px}
.shell{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px;position:sticky;top:16px}
.nav h2{font-size:11px;letter-spacing:.06em;color:var(--text-3);margin:8px 8px 6px;text-transform:uppercase}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text-2);
  padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;min-height:36px}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="true"]{background:var(--blue-weak);color:var(--blue-text);font-weight:700}
.nav button b{display:inline-block;width:18px;color:var(--text-3);font-weight:700}
.nav button[aria-current="true"] b{color:var(--blue-text)}
.stage{min-width:0}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.sizes button{background:var(--panel);border:1px solid var(--line-strong);color:var(--text-2);
  padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;min-height:36px}
.sizes button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.sizes .note{color:var(--text-3);font-size:12px;margin-left:4px}
.frameWrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;overflow:auto}
.frame{border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);
  margin:0 auto;overflow:hidden;display:flex;flex-direction:column}
.frame[data-size="lg"]{width:1194px;height:834px}
.frame[data-size="md"]{width:768px;height:1024px}
.frame[data-size="sm"]{width:375px;height:812px}
.contract{margin-top:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px}
.contract h3{margin:0 0 6px;font-size:12.5px;color:var(--text-3);letter-spacing:.04em}
.contract ul{margin:0;padding-left:18px;color:var(--text-2);font-size:13px}
.contract li{margin:3px 0}
.contract em{color:var(--bad);font-style:normal;font-weight:700}

/* ── 모의 앱 공통 ──────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100%;background:var(--bg);font-size:13px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:800;letter-spacing:.02em;margin-right:4px}
.grow{flex:1}
.btn{background:var(--panel);border:1px solid var(--line-strong);color:var(--text);
  border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;
  min-height:34px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.body{flex:1;display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.col + .col{border-left:1px solid var(--line)}
.colhead{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel);
  font-weight:700;font-size:12.5px;position:sticky;top:0;display:flex;align-items:center;gap:6px}
.colhead .sub{font-weight:400;color:var(--text-3);font-size:11.5px}
.pad{padding:12px}

/* 상태 칩 — 색만으로 표현하지 않고 글자를 함께 둔다 */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;
  font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--ok-weak);color:var(--ok);border-color:var(--ok)}
.chip.local{background:var(--blue-weak);color:var(--blue-text);border-color:var(--blue-text)}
.chip.warn{background:var(--warn-weak);color:var(--warn);border-color:var(--warn)}
.chip.bad{background:var(--bad-weak);color:var(--bad);border-color:var(--bad)}
.chip.wait{background:var(--wait-weak);color:var(--wait);border-color:var(--wait)}
.chip::before{content:"●";font-size:8px}
.chip.ok::before{content:"✓"}
.chip.bad::before{content:"!"}
.chip.warn::before{content:"!"}
.chip.wait::before{content:"…"}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 12px;margin-bottom:9px}
.card h4{margin:0 0 4px;font-size:13.5px}
.card p{margin:0;color:var(--text-2);font-size:12px}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-weak)}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--text-3);font-size:11.5px}
.h{font-weight:700;margin:0 0 8px;font-size:14px}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:8px;padding:9px 11px;margin:9px 0;font-size:12px;color:var(--text-2)}
.note.warn{border-left-color:var(--warn);background:var(--warn-weak)}
.note.bad{border-left-color:var(--bad);background:var(--bad-weak)}
.note b{color:var(--text)}
.qitem{display:flex;gap:9px;align-items:flex-start;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px}
.qitem.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-weak)}
.qnum{font-family:var(--mono);color:var(--text-3);font-size:11.5px;flex:none;padding-top:1px;min-width:22px}
.qtxt{flex:1;min-width:0;font-size:12.5px}
.qtxt .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--text-2);background:var(--bg);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px}
.tag.ai{border-style:dashed}
.grouped{border-left:3px solid var(--blue);padding-left:7px;margin-left:-1px}
.undo{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.prog{height:7px;border-radius:99px;background:var(--bg);border:1px solid var(--line);
  overflow:hidden;display:flex;margin:7px 0}
.prog i{display:block;height:100%}
.prog i.ok{background:var(--ok)} .prog i.bad{background:var(--bad)} .prog i.wait{background:var(--line-strong)}
table.k{width:100%;border-collapse:collapse;font-size:12px}
table.k th,table.k td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.k th{background:var(--bg);color:var(--text-2);font-size:11.5px}
.page{background:#fff;color:#111;border:1px solid var(--line-strong);border-radius:4px;
  padding:10px;font-size:9px;line-height:1.45;overflow:hidden}
.page .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.page .cols > div{border-right:1px dotted #bbb;padding-right:7px}
.page .cols > div:last-child{border-right:0}
.page .q{margin-bottom:7px}
.page .q b{font-family:var(--mono)}
.page .cut{background:#fdeceb;outline:1px dashed var(--bad)}
.thumbs{display:flex;gap:7px;flex-wrap:wrap}
.thumb{width:52px;height:72px;background:#fff;border:1px solid var(--line-strong);border-radius:3px;
  font-size:9px;color:#888;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;cursor:pointer}
.thumb.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-weak)}
.thumb.warn{border-color:var(--warn);background:var(--warn-weak);color:var(--warn)}
.backbar{display:none;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;font-size:12.5px}

/* ── 좁은 화면(375): 3단 → 1단, 복귀 동선을 남긴다 ─────────────── */
.frame[data-size="sm"] .body{flex-direction:column}
.frame[data-size="sm"] .col + .col{border-left:0;border-top:1px solid var(--line)}
.frame[data-size="sm"] .col[data-narrow="hide"]{display:none}
.frame[data-size="sm"] .backbar{display:flex}
.frame[data-size="sm"] .topbar .btn span.lbl{display:none}
.frame[data-size="md"] .col[data-narrow="hide"][data-tablet="hide"]{display:none}
.frame[data-size="sm"] .page .cols{grid-template-columns:1fr}
</style>
</head>
<body>
<div class="wrap">

  <div class="mockbar">모의 데이터 시안 — 제품 코드가 아닙니다
    <span>문제·문제집·쪽수·저장 상태는 전부 지어낸 예시입니다. 이 페이지는 앱의 어떤 파일도 부르지 않고 어떤 저장소에도 쓰지 않습니다.
      화면 크기 단추는 <b>모의 프레임</b>만 바꿉니다(브라우저 창이 아닙니다).</span></div>

  <div class="shell">
    <nav class="nav" aria-label="시안 화면">
      <h2>정상 흐름</h2>
      <button data-s="1" aria-current="true"><b>1</b>라이브러리 · 시작</button>
      <button data-s="2"><b>2</b>자료 + 요청</button>
      <button data-s="3"><b>3</b>처리 · 부분 실패</button>
      <button data-s="4"><b>4</b>구성안 + 원문</button>
      <button data-s="5"><b>5</b>권별 저장 결과</button>
      <button data-s="6"><b>6</b>문항 편집</button>
      <button data-s="7"><b>7</b>전체 지면 + 경고</button>
      <h2>실패·복구</h2>
      <button data-s="8"><b>8</b>충돌 복구 (B4)</button>
      <button data-s="9"><b>9</b>재개 · 원문 만료</button>
    </nav>

    <div class="stage">
      <div class="sizes" role="group" aria-label="화면 크기">
        <button data-z="lg" aria-pressed="true">1194 × 834</button>
        <button data-z="md" aria-pressed="false">768 × 1024</button>
        <button data-z="sm" aria-pressed="false">375 × 812</button>
        <span class="note">제품 UX §7 ⑥ 과제의 세 크기</span>
      </div>
      <div class="frameWrap">
        <div class="frame" id="frame" data-size="lg"></div>
      </div>
      <div class="contract" id="contract"></div>
    </div>
  </div>
</div>

<script>
/* 모의 데이터 — 전부 지어낸 값이다 */
const SCREENS = {};

const topBar = (extra="") => `
  <div class="topbar">
    <span class="brand">PEDAGOGY</span>
    ${extra}
  </div>`;

/* 1 ─ 라이브러리 · 시작 ─────────────────────────────────────── */
SCREENS[1] = {
  title:"라이브러리 · 시작",
  contract:[
    "'+ 새 문제집'은 <b>직접 만들기 / 자료로 만들기·AI</b> 두 경로를 같은 자리에서 보여준다(제품 §4).",
    "'문제집 파일 불러오기(JSON)'는 PDF 자료 투입과 <b>다른 단추</b>다 — 섞으면 무엇이 AI를 부르는지 안 보인다.",
    "사진 한 장을 현재 문제집에 넣는 기존 빠른 경로는 <b>없애지 않는다</b>.",
    "새 '영구 PDF 자료함' 탭은 만들지 않는다(계약 §3 — 작업 전용 IndexedDB이지 영구 컬렉션이 아니다)."
  ],
  html:`
  ${topBar(`<button class="btn">문제집 파일 불러오기</button>
        <span class="grow"></span>
        <button class="btn ghost">데이터 관리</button>
        <button class="btn">설정</button>`)}
  <div class="body"><div class="col"><div class="pad">
    <div class="row" style="margin-bottom:10px">
      <div class="h" style="margin:0">문제집 라이브러리</div><span class="grow"></span>
      <button class="btn primary">+ 새 문제집</button>
    </div>

    <div class="card" style="border-color:var(--blue)">
      <div class="row" style="align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:190px">
          <h4>직접 만들기</h4>
          <p>빈 문제집을 열고 문항을 하나씩 넣습니다. AI를 부르지 않습니다.</p>
          <button class="btn" style="margin-top:8px">빈 문제집 만들기</button>
        </div>
        <div style="flex:1;min-width:190px">
          <h4>자료로 만들기 · AI</h4>
          <p>PDF·사진을 넣고 원하는 구성을 말하면 여러 권으로 나눠 만듭니다.</p>
          <button class="btn primary" style="margin-top:8px">자료 고르기</button>
        </div>
      </div>
      <div class="muted" style="margin-top:9px">자료를 고르는 것만으로는 AI 처리가 시작되지 않습니다.</div>
    </div>

    <div class="h" style="margin-top:14px">내 문제집 3권</div>
    <div class="card"><div class="row"><div style="flex:1">
      <h4>2026 수능대비 미적분 N제</h4><p>문항 184개 · 어제 편집</p></div>
      <span class="chip ok">클라우드 동기화됨</span></div></div>
    <div class="card"><div class="row"><div style="flex:1">
      <h4>3월 모의 오답 재구성</h4><p>문항 22개 · 오늘 편집</p></div>
      <span class="chip local">이 브라우저에 저장됨</span></div></div>
    <div class="card"><div class="row"><div style="flex:1">
      <h4>확률과 통계 — 기하분포 특강</h4><p>문항 41개 · 3일 전</p></div>
      <span class="chip warn">확인 필요</span></div></div>
    <div class="note">'이 브라우저에 저장됨'과 '클라우드 동기화됨'을 <b>다른 말</b>로 쓴다.
      서버 ACK 전에는 동기화됨이라고 쓰지 않는다(저장 계약 §2-2).</div>
  </div></div></div>`
};

/* 2 ─ 자료 + 요청 ───────────────────────────────────────────── */
SCREENS[2] = {
  title:"자료 + 요청",
  contract:[
    "자료와 요청을 <b>같은 화면</b>에서 받는다. 고정 마법사를 만들지 않는다(제품 §4).",
    "프리셋 칩과 자유 입력을 함께 둔다 — 단원은 자유 입력 + 자동완성(D4 권장안).",
    "시작 전에 <b>처리 범위·산정 가능한 사용량·전송 안내</b>를 보여준다. 파일 선택만으로 과금하지 않는다(계약 §6).",
    "<em>추출 전에는 문항 총수·단원 수를 확정하지 않는다</em> — 쪽수만 정확히 말한다(제품 §4)."
  ],
  html:`
  ${topBar(`<button class="btn ghost">← 라이브러리</button><span class="grow"></span>`)}
  <div class="backbar"><button class="btn ghost">← 라이브러리</button><b>자료로 만들기</b></div>
  <div class="body">
    <div class="col" style="flex:1.15"><div class="colhead">자료 <span class="sub">2개 · 46쪽</span></div><div class="pad">
      <div class="card"><div class="row"><div style="flex:1">
        <h4>2025_수능_수학_기출.pdf</h4><p>28쪽 · 12.4 MB</p></div>
        <span class="chip ok">읽음</span></div>
        <div class="muted" style="margin-top:6px">처리할 쪽: 1–28 <button class="btn ghost" style="min-height:26px;padding:2px 6px">범위 바꾸기</button></div>
      </div>
      <div class="card"><div class="row"><div style="flex:1">
        <h4>미적분_심화_프린트.pdf</h4><p>18쪽 · 5.1 MB</p></div>
        <span class="chip ok">읽음</span></div>
        <div class="muted" style="margin-top:6px">처리할 쪽: 3–18 <span class="tag">1–2쪽 제외(표지)</span></div>
      </div>
      <button class="btn" style="width:100%">+ 자료 더 넣기</button>
      <div class="note">원문은 <b>이 브라우저 안에서만</b> 작업 중 보관합니다. 작업을 끝낼 때 지울지 묻습니다.
        <span class="muted">(D2 권장안 — 아직 확정 아님)</span></div>
    </div></div>

    <div class="col" style="flex:1.35" data-narrow="hide" data-tablet="show">
      <div class="colhead">요청</div><div class="pad">
      <div class="h">어떻게 나눌까요</div>
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:9px">
        <button class="btn" style="border-color:var(--blue);color:var(--blue-text)">단원별</button>
        <button class="btn">배점별</button>
        <button class="btn">난이도별</button>
        <button class="btn">N문항씩</button>
      </div>
